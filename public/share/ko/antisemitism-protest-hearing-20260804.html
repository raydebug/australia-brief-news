        <h1>시드니 증언으로 반유대주의 조사 범위가 넓어졌다</h1>
        <p>시드니의 반유대주의 왕립조사위원회는 논란이 된 시위에 대한 증언을 검토하고 있다. 팔레스타인 지지 집회와 네오나치 시위도 그 대상에 포함됐다. 중요한 이유는 개별 사건을 넘어 시위가 어떻게 관리되는지, 그리고 혐오가 공적 공간으로 어떻게 번지는지를 살펴보는 단계로 조사 범위가 넓어지기 때문이다. 앞으로는 증인과 법 집행 기관의 추가 설명이 이어질 전망이다.</p>
