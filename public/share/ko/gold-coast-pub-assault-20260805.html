        <p>골드코스트의 한 남성이 술집 폭행 이후 중태에 머물고 있으며, 사건이 진행되는 동안 피고인에 대한 보석은 거부됐다. 경찰에 따르면 Coomera Boathouse Tavern에서 벌어진 사건으로 피해자는 혼수상태에 빠졌고, 이 일은 형사 사건이자 중대한 치안 문제로 번졌다. 부상의 심각성은 향후 재판 절차와 추가 기소 여부에도 영향을 줄 것이다. 지금은 피고인이 더 넓은 폭력 사건과 연관돼 있는지가 핵심이다.</p>
