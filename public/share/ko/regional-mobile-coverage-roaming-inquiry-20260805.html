        <h1>지역 휴대전화 커버리지 검토에서 국내 로밍이 쟁점으로 떠올랐다</h1>
        <p>ACCC의 휴대전화 커버리지 조사는 지역의 통신 사각지대에 있는 사람들이 다른 네트워크로 로밍할 수 있어야 하는지에 초점을 맞추고 있습니다. 이 문제는 긴급 전화, 농장 운영, 장거리 이동과 바로 연결되며, 통신 공백은 곧바로 안전 문제로 이어질 수 있습니다. 앞으로는 규칙의 범위, 비용 부담 주체, 그리고 새 기지국 투자 의욕에 미칠 영향이 쟁점입니다.</p>
