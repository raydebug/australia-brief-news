        <h1>첫 주택 보증 제도가 투자용 전환 논란에 휩싸였다</h1>
        <p>가디언 분석에 따르면 호주의 5% 첫 주택 보증 제도로 매입된 주택 약 1,500채가 나중에 투자용 부동산으로 전환됐다. 소득 상한이 폐지된 뒤 매입이 급증해 월간 이용 건수는 5,600건을 넘어섰다고 한다. 이 제도는 원래 실거주자들의 첫 집 마련을 돕기 위한 것이지 투자자에게 우회로를 열어주려는 목적이 아니다. 이제 관건은 캔버라가 심사를 강화할지, 아니면 현행 기준을 유지할지다.</p>
