        <p>Mount Barker District Council은 심각한 안전 우려를 이유로 Forest School SA의 활동 중단을 명령했습니다. 이 논란은 아동 안전, 숲 교육, 지방 규제가 맞물리는 지점에 있습니다. 운영자는 프로그램을 재개하기 전에 의회가 제기한 문제에 답해야 합니다. 문제가 해결되지 않으면 중단이 길어지거나 공식 집행으로 이어질 수 있습니다.</p>
