        <h1>호주 PFAS 소송, 3M을 상대로 법정에 섰다</h1>
        <p>연방정부는 3M을 상대로 PFAS 소송을 시작하며, 이 회사의 소화용 포말이 국방 시설을 오염시키고 막대한 정화 비용을 국민에게 남겼다고 주장하고 있습니다. 청구액은 수십억 달러 규모로, 정부가 제기한 환경 소송 가운데 최대급이 될 수 있습니다. 이 사건이 중요한 이유는 이른바 영원한 화학물질에 대한 기업 책임의 범위가 어디까지인지 시험하기 때문입니다. 다음 단계는 증거와 책임에 대한 법원의 판단입니다.</p>
