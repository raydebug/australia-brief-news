        <p>호주는 규정을 강화해 니코틴 파우치가 옛 처방 경로로 들어오고 유통될 여지를 없앴습니다. 규제 당국은 이런 제품이 매장 우회로와 온라인을 통해 번져 왔고, 학생들이 교실이나 실내 공간에서 쉽게 숨길 수 있다고 봅니다. 중요한 이유는 니코틴 파우치가 오랫동안 단속 대상이었던 불법 담배 시장의 일부가 되었기 때문입니다. 이제 핵심은 세관 차단과 소매 단속이 수요를 따라잡을 수 있느냐입니다.</p>
