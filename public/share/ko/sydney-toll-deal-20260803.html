        <h1>시드니 통행료 인하는 내년부터 시행된다</h1>
        <p>뉴사우스웨일스주 정부는 운영사와 새로 맺은 합의에 따라 시드니의 여러 유료 도로 통행료가 내년부터 내려갈 것이라고 밝혔다. Lane Cove Tunnel, M2, Cross City Tunnel 요금이 낮아질 예정이다. 이 계획이 중요한 이유는 통행료 체계를 없애지 않으면서도 통근자 부담을 줄이겠다고 약속하기 때문이다. 앞으로는 실제로 얼마나 절감 효과가 운전자들에게 돌아가는지가 관건이다.</p>
