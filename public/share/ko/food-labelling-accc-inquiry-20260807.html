        <p>Four Corners 보도에서 원산지 표시 허위와 오염된 제품 의혹이 제기된 뒤 ACCC가 조사를 시작했다. 규제 당국은 그 행위가 소비자법을 어겼는지, 쇼핑객을 오도했는지 살펴볼 예정이다. 식품 라벨은 슈퍼마켓 공급망에 대한 신뢰와 구매 판단에 직접 영향을 주기 때문에 이 문제는 중요하다. 다음 단계는 조사 결과가 집행 조치로 이어질지, 아니면 라벨 규정 전반의 변화로 확장될지다.</p>
