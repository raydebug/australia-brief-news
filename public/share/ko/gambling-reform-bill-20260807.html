        <p>노동당의 도박 광고 규제 강화안이 상원에서 더 큰 반발에 직면했습니다. 연합, 녹색당, 무소속 의원들은 더 강한 규칙을 요구하고 있습니다. 쟁점은 유인책, 광고 제한, 그리고 이 법안이 도박 피해를 줄일 만큼 강한지입니다. 결과에 따라 TV, 라디오, 스포츠, 온라인에서 베팅 광고가 어떻게 보일지가 결정됩니다. 정부는 큰 수정안을 받아들여야 할 수도 있습니다.</p>
