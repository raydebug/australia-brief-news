        <h1>NSW 경찰이 ABC 검증 이후 바디캠 규정을 손본다</h1>
        <p>ABC 보도에서 장비 사용상의 문제가 드러난 뒤 NSW 경찰이 바디캠 정책을 수정하고 있다고 밝혔습니다. 이 변화가 중요한 이유는 카메라 규정이 증거 확보, 민원 처리, 그리고 현장 경찰에 대한 신뢰에 직접 영향을 주기 때문입니다. 이제 남은 질문은 규정만 고치는 것으로 충분한지, 아니면 교육과 감독도 함께 바뀌어야 하는지입니다.</p>
