        <h1>시드니 개발업체의 저렴한 주택 약속이 시험대에 올랐다</h1>
        <p>보도에 따르면 개발사은 시드니 프로젝트에서 내건 저렴한 주택 약속을 2년 일찍 끝내려 했고, 계획법 변경이 원래 합의를 대체해야 한다고 주장했다. 주 규제당국은 이미 이 개발업체의 커뮤니티 주택 부문이 입주민을 공정하고 투명하게 대하지 않았다고 비판한 바 있다. 더 큰 쟁점은 사업이 진행된 뒤에도 저렴한 주택 약속이 얼마나 실효성을 갖느냐는 점이다. 앞으로는 빠른 합의보다 규제와 법적 검토가 더 이어질 가능성이 크다.</p>
