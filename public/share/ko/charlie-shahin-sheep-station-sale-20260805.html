        <h1>찰리 샤힌이 남호주 대형 양 목장을 사들였다</h1>
        <p>억만장자 찰리 샤힌이 남호주 북서부의 약 130만 헥타르에 달하는 양 목장을 사들였다. 대상은 대형 목장 세 곳으로, 이 거래가 주목되는 이유는 호주 최대급 목장 묶음이 이미 남호주에서 잘 알려진 가문의 손으로 넘어갔기 때문이다. 이는 세대교체와 자금 압박 속에서도 대형 농업 자산이 계속 거래되고 있음을 보여준다. 이제 관심은 새 주인이 목장을 어떻게 운영할지, 그리고 지역의 양모·양 생산에 어떤 영향을 줄지다.</p>
