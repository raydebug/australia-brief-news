        <h1>노스 시드니 올림픽 풀이 1억2200만 호주달러 재개발 끝에 다시 문을 열었다</h1>
        <p>노스 시드니 올림픽 풀이 5년과 1억2200만 호주달러가 투입된 재개발을 마치고 다시 문을 열었다. 1936년에 개장한 이 시설은 새로 손질된 수영장과 편의시설을 갖췄고, 처음 사흘은 일반에 무료로 개방된다. 이 소식이 중요한 이유는 공공 자산이면서도 오래도록 비용 논란이 이어진 사업이었기 때문이다. 이제 쟁점은 완성된 시설이 들인 비용만큼의 가치를 보여주느냐다.</p>
