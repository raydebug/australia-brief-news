        <h1>한슨의 취재 제한이 언론 자유 논란을 불렀다</h1>
        <p>폴린 한슨은 빅토리아주의 한 기자회견에서 주요 언론사 몇 곳의 출입을 막았고, 나중에는 불공정 보도에 대한 임시 경고였다고 설명했다. 이 논란은 원네이션이 후보를 내세우며 주 정치에서 존재감을 키우려던 시점에 터졌다. 누구를 현장에 들일지 정치인이 정할 수 있느냐는 점에서, 취재 접근과 감시의 기본 원칙이 걸려 있다. 한슨은 이 조치가 영구적이지 않다고 했지만, 비판을 철회하지는 않았다.</p>
