        <h1>연료 세제 혜택 종료로 호주 주유비가 다시 오른다</h1>
        <p>8월 3일 자정에 임시 연료세 감면이 끝나면서 도매 연료비가 리터당 16센트 올라갔고, 며칠에 걸쳐 주유소 가격도 따라 오를 전망입니다. 이 변화는 가계 지출과 운송비, 물가에 바로 연결되기 때문에 중요합니다. 주유소들은 먼저 기존 재고를 소진할 가능성이 있어 가격 상승은 한 번에 나타나지 않을 수 있습니다. 앞으로는 도시별 인상 속도와 경쟁당국이 과도한 가격 인상 징후를 잡아내는지가 관건입니다.</p>
