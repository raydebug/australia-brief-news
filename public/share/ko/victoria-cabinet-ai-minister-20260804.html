        <p>빅토리아주의 새 내각은 교통 인프라와 Suburban Rail Loop 책임을 기존 구조에서 떼어내 다시 나눴고, 동시에 AI 장관 자리도 신설했습니다. 이번 변화는 지난주 지도부 교체와 여러 장관 사임 뒤에 이뤄진 것으로, 여러 포트폴리오가 한꺼번에 조정됐습니다. 대형 사업과 신기술 정책을 누가 이끌게 되는지 바꾸는 만큼 중요합니다. 앞으로 새 팀이 얼마나 빨리 안정돼 의제를 계속 밀어붙일 수 있는지가 관건입니다.</p>
