        <p>뉴사우스웨일스 부패 방지 청문회에서는 장-클로드 페로텟이 자유당 의원의 사무실에서 일하는 동안 진영 활동을 했다는 증언이 나왔고, 녹음 통화와 문자도 기부와 분기 세력 확장 의혹을 키웠다. 쟁점은 당내 정치, 후원금, 그리고 세금으로 운영되는 자리의 역할이 뒤섞였는지 여부다. 추가 증인이 남아 있어 조사는 계속되며, 당내 권력 구도에도 영향을 줄 수 있다. 아직 누구의 위법도 확정되지 않았지만 압박은 커지고 있다.</p>
