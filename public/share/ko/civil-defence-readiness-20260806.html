        <h1>호주, 전시 민방위 준비를 다시 점검하다</h1>
        <p>새 연방 조사는 분쟁으로 전국의 물자 공급, 연료, 정부 서비스, 기업 활동이 흔들릴 때 호주가 이를 어떻게 유지할지 살펴봅니다. 이번 검토는 군사력만이 아니라 행정기관과 민간 부문이 위기 속에서 어떻게 협력하는지도 다룹니다. 중요한 이유는 이런 수준의 전국적 준비 점검이 제2차 세계대전 이후 거의 없었기 때문입니다. 앞으로는 공급망과 조정 체계의 가장 약한 부분을 보여 주는 증거가 얼마나 모이느냐가 관건입니다.</p>
