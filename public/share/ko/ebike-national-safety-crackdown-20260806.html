        <h1>호주는 전국 전기자전거 안전 규제 강화에 나선다</h1>
        <p>연방 정부는 부상과 사고가 늘어나고 주별 규정이 제각각인 문제를 줄이기 위해 전기자전거와 전동 스쿠터, 전동 스케이트보드의 전국 기준을 마련하도록 ACCC에 요청했다. 이번 조치는 위험한 고출력 장비가 허점 때문에 계속 팔리는 상황을 막으려는 것이다. 전기 이동수단이 빠르게 퍼졌지만 안전 규정은 그 속도를 따라가지 못했다는 점에서 의미가 크다. 기준안은 업계와 규제 당국의 협의를 거친 뒤 시행 절차로 넘어간다.</p>
