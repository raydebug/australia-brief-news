        <h1>호주 주택 가격 하락이 시드니와 멜버른 밖으로 번지고 있다</h1>
        <p>최근 주택 자료에 따르면 7월 전국 집값은 0.7퍼센트 떨어졌고, 약세는 시드니와 멜버른을 넘어 다른 주요 도시로도 퍼지고 있다. 전문가들은 높은 금리, 투자자 세제 변화, 약해진 시장 심리를 주요 원인으로 본다. 주택은 가계 자산과 대출, 그리고 정치까지 좌우하는 핵심 변수이기 때문에 이 하락은 중요하다. 앞으로는 이 조정이 작은 수준에서 멈출지, 아니면 더 크게 이어질지가 관건이다.</p>
