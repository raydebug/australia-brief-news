        <h1>Simcoa 说将在关税冲击后退出美国市场</h1>
        <p>澳洲唯一的硅生产商表示，美国贸易机构追加 40% 关税后，公司下周将退出美国市场。Simcoa 说，这一裁定让业务变得无法持续，并迫使公司转向东南亚和印度等其他市场。之所以重要，是因为这件事显示，美国贸易措施可以迅速改变澳洲关键矿产出口的商业格局。接下来要看堪培拉是否会反击，还是把这视为一项商业决定。</p>
