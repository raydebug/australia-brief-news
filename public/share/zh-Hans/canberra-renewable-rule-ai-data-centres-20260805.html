        <h1>堪培拉准备为人工智能数据中心设定可再生能源规则</h1>
        <p>联邦政府正准备出台全国性规则，要求新的人工智能数据中心以可再生能源而不是天然气供电。这个方向之所以重要，是因为服务器机房的扩张已经碰到电网容量、州规划审批和电价政治的限制。Chris Bowen说，即便昆州和北领地反对，堪培拉也应该能设定全国底线。接下来要看，这套立法能否通过，同时又不拖慢投资或削弱供电可靠性。</p>
