        <h1>工党的移民改革遭到商界和议员反对</h1>
        <p>联邦政府正在考虑调整技术和家庭签证处理方式，试图压低净海外移民人数，同时永久移民配额仍维持在 18.5 万。消息说 Tony Burke 推迟了重要演讲，因为部长们在考虑优先处理已经在澳洲境内的人。之所以重要，是因为商界担心更紧的政策会加剧劳动力短缺，而工党又同时面对联盟党、一国党和部分自己议员的压力。接下来要看政府愿意把系统收紧到什么程度，而不引发更大的反弹。</p>
