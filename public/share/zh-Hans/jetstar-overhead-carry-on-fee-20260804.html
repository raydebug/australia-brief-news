        <h1>捷星航空把头顶行李变成付费选项</h1>
        <p>捷星航空将从 2027 年 2 月起调整客舱行李规则，免费部分只保留一件小型座椅下行李，而放入头顶行李舱的大件行李需要购买 Priority Carry-on。报道提到，短航线价格大约从 25 澳元起，较长航线可能超过 50 澳元，原来的 7 公斤总重量限制也会取消。这个变化重要，是因为它重新定义了澳洲廉航最常见的服务组合，也会改变旅客的打包方式和登机成本。接下来要看的是旅客是否接受这项新收费，以及其他航空公司会不会跟进。</p>
