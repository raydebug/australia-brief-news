        <h1>家庭支出回升，电动车购买带动反弹</h1>
        <p>澳大利亚家庭支出在 6 月上涨了 0.8%，主要受新车购买增加和电动车销量回升带动。这个数据重要，因为它表明即使面对生活成本压力，消费者仍在支出，而且交通选择正在影响每月统计。航空出行也从前期疲弱中恢复，这说明部分家庭仍愿意为较大额消费买单。接下来要看，在燃料和整体价格压力趋稳之后，这种增长势头能否持续。</p>
