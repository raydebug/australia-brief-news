        <h1>汇丰开始退出澳洲零售银行业务</h1>
        <p>汇丰将在18个月内逐步收缩澳洲零售银行业务，并把价值360亿澳元的住房和个人贷款组合卖给黑石。约19家分行会关闭，但公司会保留企业、机构、资管和私人银行业务。这个变化意味着，澳洲客户可面对面办理银行业务的选择会进一步减少，员工安排也会进入调整期。交易还要经过监管批准，接下来要看的，是贷款服务、账户迁移和岗位变动会怎样落地。</p>
