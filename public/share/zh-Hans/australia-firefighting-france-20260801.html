        <h1>澳大利亚将派出消防队和飞机支援法国扑救山火</h1>
        <p>澳大利亚正向法国派出一架支努干直升机、一架支援飞机和消防人员，协助应对欧洲多地持续扩大的山火。法国和西班牙的救火队仍在同一轮高温干燥天气后的快速火线前作战，澳方支援会补上空中运力和夜间灭火能力。这件事重要，因为澳大利亚正在把多年积累的灭火经验投入海外紧急行动，而北半球仍处在又一个严峻的火季。任务何时开始、持续多久，要看前线火势的发展。</p>
