        <h1>禽流感已变成全国性的野生动物威胁</h1>
        <p>澳大利亚的禽流感问题正在从零散检出走向更广泛的野生动物风险，最新警告称企鹅、海豚和数百种本土物种都可能受影响。这个问题重要，是因为一旦病毒进入繁殖地或迁徙通道，损失会来得很快，也很难控制。最新报道一方面提到本地栖息地的风险，另一方面也有联邦评估把近400种物种列入危险范围。接下来要看监测和生物安全措施，能不能在更多栖息地受影响前把扩散速度压下来。</p>
