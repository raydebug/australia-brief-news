        <h1>禽流感威胁扩大到企鹅和数百种澳洲物种</h1>
        <p>最新警告称，禽流感可能比当前疫情显示的范围更广，企鹅、海豚以及近400种物种都面临风险。这个问题重要，是因为一旦 H5 进入密集栖息地或偏远栖息地，损害可能来得很快，也更难控制。官方现在把准备工作当成生物安全问题，而不是遥远的海外威胁。接下来要看监测、农场管控和野生动物规划，能否在病毒扩散到更多繁殖地之前把它压下来。</p>
