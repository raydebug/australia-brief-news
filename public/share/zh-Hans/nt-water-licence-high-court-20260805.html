        <h1>高院让原住民土地权持有人在北领地水权争议中暂时占上风</h1>
        <p>中澳原住民土地权持有人在高等法院就一项大型地下水许可证取得了有利结果，这项许可涉及 Tennant Creek 附近的园艺开发。Fortune Agribusiness 本可在 Singleton Station 每年抽取40吉升地下水，持续30年，地方代表说这会威胁神圣地点和沙漠水系统。这个结果重要，因为它再次检验澳大利亚如何在大规模农业开发、土地权与文化遗产之间取得平衡。下一步还要看，这项许可和项目会面临怎样的法律与行政后果。</p>
