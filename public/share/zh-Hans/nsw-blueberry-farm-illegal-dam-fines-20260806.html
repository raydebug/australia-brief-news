        <p>新州法院就北海岸一处蓝莓农场的非法水坝，对两名农民罚款超过 13 万澳元。此案说明，即使是区域性的小型农场，水资源和土地使用争议也会被带上法庭。它也凸显监管机构持续执行地方环境规则的压力。两名农民不必拆除水坝，但这笔罚款已向其他土地持有人发出明确警告。</p>
