        <h1>SA 灰狗训练师因严重违反福利规定而被禁止</h1>
        <p>Greyhound Racing SA 在发现屡次违反动物福利规定后，取消了 Riverland 训练师弗农·安德森 (Vernon Anderson) 的参赛资格八年多。该小组表示，他未能为一只身体不适的狗提供兽医护理，没有为其他狗提供足够的水，并将灰狗关在不合适的拖车里。这一决定很重要，因为它使福利标准重新成为人们关注的焦点，并表明监管机构正在严肃对待违规行为。下一步是该裁决是否会促使整个行业对饲养和训练条件进行更广泛的审查。</p>
