        <h1>澳洲5%首付计划被越来越多地当成投资通道</h1>
        <p>联邦5%首付计划的新检查显示，2020年到2026年5月间，近1500套通过该计划购入的房子后来变成了投资房。这个计划本意是让首次购房者只借到房价95%，由政府作担保，但数据说明，一些高收入买家也在使用它。这个问题重要，因为该计划还在扩大，房价压力并不均衡，政策制定者需要弄清楚它到底是在帮助真正的买家上车，还是在帮助投资者加杠杆。下一步要看政府会不会收紧资格、披露或监管规则。</p>
