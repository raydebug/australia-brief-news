        <h1>澳洲父母签证积压多年，家庭被迫长期等待</h1>
        <p>澳洲父母签证制度再次承压。最新报道显示，在长达21个月的等待期里，超过1500名申请人在签证获批前离世。贡献型父母签证费用约为5万澳元，即便如此也可能要等上约15年；更便宜的父母签证则可能拖得更久。这个问题之所以重要，是因为它让移民家庭被高额费用、漫长队列和海外日渐年迈的亲人困住。下一步要看政府是否会把父母签证纳入更广泛的移民调整，还是继续让积压问题维持原状。</p>
