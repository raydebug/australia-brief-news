        <h1>特拉维斯·海德连续第二年拿下艾伦·博德勋章</h1>
        <p>特拉维斯·海德在又一个对澳大利亚队表现强势的赛季后，连续第二年拿下艾伦·博德勋章。他在 Ashes 中打出三记百余分的得分，并且在各个赛制里都保持稳定，最终在投票中压过亚历克斯·凯里和米切尔·斯塔克。这之所以重要，是因为这枚勋章仍然是衡量澳大利亚男板球选手跨赛制表现最清晰的标尺。接下来要看的是，在外界批评颁奖形式之后，Cricket Australia 下次会怎样呈现这个奖项。</p>
