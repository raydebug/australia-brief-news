        <h1>卫生监管机构因群发邮件泄露医生信息而道歉</h1>
        <p>澳洲卫生投诉监管机构因一封群发邮件泄露了100多名受邀参加成瘾和酒精护理网络研讨会的医生、护士和其他从业者的身份而道歉。这个事件之所以重要，是因为邮件把姓名和敏感培训主题直接联系在一起，也让外界重新关注医疗数据的处理方式。AHPRA表示，事件已上报给监察机构，并已向受影响人员致歉。接下来要看的是，监管机构会不会调整邮件安全措施，以及是否会引发更广泛的隐私审查。</p>
