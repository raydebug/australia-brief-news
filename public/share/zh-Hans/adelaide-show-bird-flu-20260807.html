        <h1>阿德莱德皇家展会因禽流感升温取消禽鸟展区</h1>
        <p>南澳大利亚州的 H5 禽流感病例持续上升后，阿德莱德皇家展会将不再举办鸟类和家禽展区。主办方是在活动仍将照常举行的前提下，缩减动物展示，以降低传播风险。这件事重要，因为疫情已经开始改变公众活动，而不只是野生动物监测。接下来要看的是，如果病例继续增加，更多农业展会和与农场相关的活动是否也会受到同样限制。</p>
