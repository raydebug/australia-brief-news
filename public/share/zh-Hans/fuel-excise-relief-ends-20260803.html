        <h1>燃油优惠结束，澳洲加油价格开始回升</h1>
        <p>8月3日午夜，临时燃油消费税减免结束，批发燃油成本每升上调16澳分，未来几天零售油价也会跟着走高。这个变化直接影响家庭支出、货运成本和通胀。由于加油站会先消化旧库存，涨幅预计不会一下子全部体现出来，但监管机构已经警告不要趁机抬价。接下来要看涨价会多快传导到各地，以及澳洲竞争与消费者委员会是否发现异常操作。</p>
