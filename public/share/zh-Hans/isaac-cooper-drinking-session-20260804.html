        <h1>Isaac Cooper 因格拉斯哥饮酒事件退出队内领导层</h1>
        <p>澳大利亚游泳选手 Isaac Cooper 因在格拉斯哥英联邦运动会期间被指没有留在场边支持队友、而是外出饮酒，已退出“海豚队”的领导小组。澳大利亚游泳协会说，他缺席了比赛最后一晚和队内会议，这与团队要求不符。这个事件之所以重要，是因为 Isaac Cooper 是澳大利亚较知名的游泳选手之一，队伍原本也依赖他参加接力和仰泳项目。他仍计划于8月12日在美国参加泛太平洋游泳锦标赛，接下来要看这次处分会不会影响他在国家队的长期位置。</p>
