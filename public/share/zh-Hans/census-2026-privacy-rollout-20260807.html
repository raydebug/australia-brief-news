        <h1>澳洲2026年人口普查面临隐私质疑和未收到纸质指引的投诉</h1>
        <p>2026年人口普查定于8月11日进行，澳大利亚统计局正要求各家各户通过线上或纸质方式完成填报。与此同时，有人反映自己仍未收到指引，这又加重了围绕新设性别、性取向和祖先问题的隐私担忧。它之所以重要，是因为人口普查数据会直接影响全国的资金分配和公共服务规划。接下来要看的是，统计局能否在普查夜之前把说明送到位，避免出现大范围混乱。</p>
