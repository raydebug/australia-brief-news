        <h1>西澳正在收紧 FOGO 垃圾桶规则</h1>
        <p>西澳大利亚州收紧了 FOGO 垃圾桶规则，取消了居民过去可以放进绿色垃圾桶的几类物品。州政府表示，这样做是为了减少污染、让堆肥系统真正运转起来，但更新时点让一些市政机构和居民感到困惑。之所以重要，是因为垃圾分类系统只有在大家清楚知道该放什么的时候才能有效运行。接下来要看的是，新规则是否解释得足够清楚，以免再出现更多污染和投诉。</p>
