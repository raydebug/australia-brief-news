        <h1>工党扩大商业屋顶太阳能补贴，瞄准企业电费</h1>
        <p>联邦政府正扩大太阳能折扣计划，让更大的商业屋顶系统也能享受补贴，而不再只局限于小型安装。官员表示，中型企业大约可节省 6.8 万澳元的安装成本，较大的仓库或工厂则可一次性省下约 23.2 万澳元，并在每年电费上减少约 17.5 万澳元。这个举措之所以重要，是因为它把政策重点放到一直落后于家庭屋顶太阳能的商业场景，尤其是工厂、零售和物流场地。接下来要看的是审批速度和安装能力能否跟上。</p>
