        <h1>Murwillumbah 家族重新寻找 Yvonne Whear</h1>
        <p>Yvonne Whear 的家人在73 岁的老人几个月前在 Murwillumbah 附近失踪。警方表示，她最后一次已知的活动是在二月份被捕捉到的，调查人员仍需要了解此后发生的事情的线索。此案很重要，因为搜寻工作已经持续了半年多，家人或警方都没有得到答案。下一步是公共帮助，包括任何看到她的汽车或在北部河流周围活动的人。</p>
