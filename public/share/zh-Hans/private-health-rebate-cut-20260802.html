        <h1>澳洲老年人的私保账单将继续上升</h1>
        <p>联邦政府仍在推进调整方案，要把65岁以上澳洲人的额外私保补贴收窄，很多人从2027年4月起将看到保费上升。政府把它包装成按收入而不是按年龄发放补贴，并把节省下来的钱转去支持养老照护。争议点在于，批评者担心更多长者会放弃私保，把压力转回公立医院，而政府则认为这笔预算取舍已经不能再拖。</p>
