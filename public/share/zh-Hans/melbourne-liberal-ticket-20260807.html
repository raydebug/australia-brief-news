        <p>Roshena Campbell 预计将拿下维州西部大都会区自由党提名第一位，从墨尔本市政厅走向州议会。若最终确认，这一变化将让副市长职位出现空缺，并重组城市领导层。这很重要，因为它可能同时改变自由党名单和墨尔本市议会的力量平衡。接下来是正式确认以及市议会如何处理这个空缺。</p>
