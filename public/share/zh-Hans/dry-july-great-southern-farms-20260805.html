        <h1>西澳南部七月干旱，农民仍在等雨</h1>
        <p>西澳南部的农户进入八月时，七月降雨明显低于正常水平，土壤水分和蓄水都在承压。部分内陆地区此前该下的雨没有真正落到位，现在更需要下一轮有效降雨来支撑作物、牲畜和水库。未来几天如果雨带继续变化，农民得到的缓解仍可能不均衡。</p>
