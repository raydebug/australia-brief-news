        <h1>越来越多澳洲人开始准备职业备选方案</h1>
        <p>7NEWS 报道说，随着工作要求变化和 AI 改变就业环境，越来越多澳洲人开始考虑第二条职业路径。报道举了一个 22 岁年轻人重返学习信息技术的例子，也提到调查显示，不少上班族并不确定自己最初的职业选择还能否长期适用。这个变化重要，因为技能更新已经不只是个人规划，也是就业安全的一部分，尤其对年轻人和准备转型的人更明显。接下来要看的是，培训体系能否跟上这种不确定感。</p>
