        <h1>燃油税减免结束后，澳洲油价预计上行</h1>
        <p>澳洲临时燃油税减免已经结束，接下来几天汽油和柴油价格预计会逐步上升。零售端不会在同一时间立刻完全反映，因为加油站仍在消化此前进货，但批发层面的税负已经回到正常水平。这件事会直接影响家庭通勤支出和货运成本。接下来要观察的是成本传导有多快，以及监管部门能否压住不合理涨价。</p>
