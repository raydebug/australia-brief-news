        <h1>工党赌改方案在参议院遇阻</h1>
        <p>联邦赌博改革方案在参议院遭遇阻力，联盟党、绿党和几名独立议员都在推动更严格的广告和诱导限制。争议又和调查听证联系在一起，听证中有指控称博彩公司曾向高价值客户提供毒品和性工作者，而相关公司都予以否认。这个议题之所以重要，是因为工党想在收紧赌博规则的同时保住整套法案。接下来要看，部长们是否会进一步修改方案，以争取在8月17日调查报告前拿到足够支持。</p>
