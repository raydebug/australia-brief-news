        <h1>当母鸡搬到室内时，散养鸡蛋标签保持不变</h1>
        <p>A澳大利亚鸡蛋生产商正在将母鸡搬到室内以限制禽流感风险，监管机构放宽了散养标签规则以适应这一变化。这很重要，因为它同时影响消费者期望、食品价格和生物安全。现在的关键问题是疾病压力是否有所缓解，或者是否会出现更多限制。</p>
