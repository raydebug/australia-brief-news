        <h1>燃料进口把澳洲贸易顺差压到多年低点</h1>
        <p>澳洲六月季度的货物贸易顺差降至约 11 亿澳元，原因是燃料和电动车进口大幅增加。直接推手仍然是中东燃料冲击，各方都在抢运额外货源，这很重要，因为贸易平衡如今已经把供应应对的代价清楚地反映出来。接下来要看的是，燃料价格和进口量会不会在下一次澳洲统计局数据里继续拖累贸易表现。</p>
