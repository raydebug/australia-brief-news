        <h1>特拉維斯·海德連續第二年拿下艾倫·博德勳章</h1>
        <p>特拉維斯·海德在又一個對澳洲隊表現強勢的球季後，連續第二年拿下艾倫·博德勳章。他在 Ashes 中打出三記百餘分的得分，並且在各項賽制裡都保持穩定，最終在投票中壓過亞歷克斯·凱里和米切爾·史塔克。這之所以重要，是因為這枚勳章仍然是衡量澳洲男子板球選手跨賽制表現最清楚的標尺。接下來要看的是，在外界批評頒獎形式之後，Cricket Australia 下次會怎樣呈現這個獎項。</p>
