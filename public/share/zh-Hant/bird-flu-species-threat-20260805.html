        <h1>禽流感威脅擴大到企鵝和數百種澳洲物種</h1>
        <p>最新警告稱，禽流感可能比目前疫情顯示的範圍更廣，企鵝、海豚以及近400種物種都面臨風險。這個問題重要，是因為一旦 H5 進入密集棲息地或偏遠棲息地，損害可能來得很快，也更難控制。官方現在把準備工作當成生物安全問題，而不是遙遠的海外威脅。接下來要看監測、農場管制和野生動物規劃，能否在病毒擴散到更多繁殖地之前把它壓下來。</p>
