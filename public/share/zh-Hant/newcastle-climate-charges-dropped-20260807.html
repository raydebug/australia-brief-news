        <h1>紐卡斯爾氣候抗議案件大量撤銷指控</h1>
        <p>與 2024 年紐卡斯爾煤港封鎖有關的 100 多項指控已被撤銷或放棄，這意味著針對氣候抗議者的一宗重大案件就此結束。這個決定經歷了漫長的法律拉鋸，之所以重要，是因為它會改變警方在澳洲最敏感工業地點之一處理抗議活動時的風險判斷。現在的關鍵問題是，在早前起訴推進不順之後，警方和檢方是否已經調整策略。若有上訴或後續法律動作，都會受到關注。</p>
