        <h1>兩名澳洲無名戰死者在數十年後被確認身分</h1>
        <p>澳洲軍方的戰爭遺骸確認工作，近日為兩名長期以「無名澳洲人」下葬的士兵確認了身分。一人死於1918年的法國戰場，另一人死於1942年的巴布亞紐幾內亞，兩人的墓地接下來都會換上寫有姓名的墓碑。這件事的重要性在於，它為家屬補上了遲來的答案，也說明這項身分確認計畫仍在持續修補歷史空白。只要檔案和墓葬地點還能繼續核對，未來仍可能有更多舊遺骸被認出來。</p>
