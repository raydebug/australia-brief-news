        <h1>凱特·曼利之死引發奧爾伯里醫院轉送延誤調查</h1>
        <p>新南威爾士州驗屍庭已啟動，對凱特·曼利在奧爾伯里基地醫院去世前所接受的照護展開調查。調查會重點看轉送延誤以及她在精神健康病房內的處理方式，是否符合當時應有標準。此案重要，因為醫院交接一旦出問題，本來還有機會處理的病情也可能迅速惡化為致命結果。接下來兩週，法庭還會聽取醫護人員和家屬證詞。</p>
