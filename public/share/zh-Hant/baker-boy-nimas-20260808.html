        <h1>Baker Boy 在達爾文包攬 NIMAs 三項重獎</h1>
        <p>達爾文舉行的國家原住民音樂獎上，Baker Boy 拿下專輯、歌曲和音樂錄影帶三項榮譽，Birdz 與 Fred Leone 則獲得年度藝人。這個結果之所以重要，是因為它反映出哪些原住民音樂人正在全國範圍內真正破圈，而不只是停留在各自社群。對 Baker Boy 來說，這又鞏固了他在新一輪發行和巡演中的關注度。接下來要看的是，獲獎能否繼續轉化為巡演、串流和音樂節邀約。</p>
