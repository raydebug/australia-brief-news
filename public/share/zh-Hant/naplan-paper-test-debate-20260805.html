        <h1>NAPLAN 成績下滑讓紙筆考試再度成為焦點</h1>
        <p>教育部長們再次討論讓 NAPLAN 回到紙筆考試，因為最新結果顯示，全國讀寫和算術成績都很弱。大約三分之一學生沒有達到基本標準，閱讀成績在各年級都比 2025 年更差，三年級數學仍然令人擔憂。這個消息重要，因為它重新引發了對數位化測試、課堂支援和螢幕使用影響的討論。下一步要看，各州部長是否會用這些結果來調整 NAPLAN 的做法。</p>
