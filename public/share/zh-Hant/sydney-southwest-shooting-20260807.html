        <h1>警方將格林納克槍擊案與一輛燃燒皮卡連起來</h1>
        <p>警方說，一名 18 歲男子在格林納克中槍，隨後在格蘭維爾發現一輛燒毀的皮卡，他們認為兩起事件有關聯。之所以重要，是因為這起發生在雪梨西南部的暴力事件，可能還伴隨車輛縱火來掩蓋線索。接下來警方要查清誰參與其中，以及槍擊為什麼會發生。眼下，傷者仍在醫院，調查還在繼續。</p>
