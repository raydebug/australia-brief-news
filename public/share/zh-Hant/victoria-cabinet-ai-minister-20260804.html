        <h1>維州重組內閣，新增 AI 部長並縮減基礎設施組合</h1>
        <p>維多利亞州的新內閣把交通基礎設施和郊區鐵路環線等職責重新拆分，同時也新設了 AI 部長職位。這次調整發生在上週領導層更替和多名內閣成員辭職之後，因此多個組合被一起重排。它之所以重要，是因為這會改變大型項目由誰主導，也說明政府下一步想把政策重點放在哪裡。接下來要看的是，新班子能否盡快穩定下來，把議程繼續往前推。</p>
