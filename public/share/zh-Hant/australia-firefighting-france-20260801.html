        <h1>澳洲將派出消防隊與飛機支援法國撲救山火</h1>
        <p>澳洲正向法國派遣一架支努干直升機、一架支援飛機和消防人員，協助應對歐洲多地持續擴大的山火。法國與西班牙的救火隊仍在同一輪高溫乾燥天氣後的快速火線前作戰，澳方支援可補上空中運力與夜間滅火能力。這件事重要，因為澳洲正在把多年累積的滅火經驗投入海外緊急行動，而北半球仍處於另一個嚴峻火季。任務何時啟動、會持續多久，取決於前線火勢的變化。</p>
