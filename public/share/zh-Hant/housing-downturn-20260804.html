        <h1>澳洲房價下行加深，跌勢擴散到更多城市</h1>
        <p>澳洲房價在7月再次回落，而且跌勢已不再只侷限於雪梨和墨爾本。Cotality的數據顯示，全國房價下跌0.7%，布里斯本和阿德萊德也持續走弱，而各家銀行正在重新調整全年預測。這個變化會影響借貸能力、投資者情緒，以及等待更低門檻入市的首購族。接下來要看降息預期或信貸環境是否能減緩這一波下滑。</p>
