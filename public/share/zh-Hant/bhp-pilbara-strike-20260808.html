        <h1>皮爾巴拉罷工威脅必和必拓鐵礦石運輸</h1>
        <p>必和必拓位於西澳黑德蘭港的出口終端再度停工，工人就薪酬與工作條件展開為期兩天的爭議。約150名員工參與行動，涉及裝船與相關工作，而這裡是澳洲最大的散裝鐵礦石港口之一。由於去年財年該礦區運出數億噸鐵礦石，即使短暫中斷也可能影響公司收入、州財政和海外客戶。雙方預計在8月18日恢復談判，但加薪幅度和時間表仍然沒有接近共識。</p>
