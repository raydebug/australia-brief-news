        <h1>工黨的移民改革遭到商界和議員反對</h1>
        <p>聯邦政府正在考慮調整技術和家庭簽證處理方式，試圖壓低淨海外移民人數，同時永久移民配額仍維持在 18.5 萬。消息說 Tony Burke 推遲了重要演講，因為部長們在考慮優先處理已經在澳洲境內的人。之所以重要，是因為商界擔心更緊的政策會加劇勞動力短缺，而工黨又同時面對聯盟黨、一國黨和部分自己議員的壓力。接下來要看政府願意把系統收緊到什麼程度，而不引發更大的反彈。</p>
