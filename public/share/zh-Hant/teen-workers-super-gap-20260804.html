        <h1>過時規則讓青少年打工者少拿退休金</h1>
        <p>AAP 說，一條長期存在的規則正在讓許多青少年打工者拿不到應有的退休金，時間越久，損失越大。報道估算，這個漏洞可能讓年輕人整個職業生涯少拿一萬澳元以上。它重要，因為問題從一開始就打到低薪工人身上，而且會滾成更大的退休缺口。接下來要看的是，立法者會不會盡快堵上這個漏洞。</p>
