        <h1>維州醫院醫生定下停工日期</h1>
        <p>維州公立醫院醫生計劃在 8 月 13 日停工，薪酬糾紛已經波及墨爾本幾家最大醫院。行動安排在下午 12:30 到 4:00，皇家墨爾本醫院、皇家兒童醫院、皇家婦女醫院以及附近機構都會受影響，而急診醫生仍會留在崗位上。之所以重要，是因為這是維州公立醫院 20 年來首次獲保護的工業行動，非緊急門診和手術可能需要改期。接下來要看政府和工會能否在停工前縮小分歧。</p>
