        <h1>墨爾本法院將涉ISIS母女送審</h1>
        <p>墨爾本法院已裁定，卡瓦薩爾·艾哈邁德和她的女兒澤伊納布·艾哈邁德將就奴役指控接受審判。檢方稱，這個家庭與伊斯蘭國有關，並控制過一名雅茲迪少女；案件接下來會進入維多利亞州最高法院，8月21日還有一次庭審安排。這宗案件的重要性在於，它展示了澳洲法院如何處理在伊斯蘭國崩解期間發生、但與澳洲有關聯的嚴重罪行。下一步將進入庭前程序，證據和具體指控都會被檢驗。</p>
