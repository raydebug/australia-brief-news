        <h1>澳廣就諷刺片段道歉，引發更大的風波</h1>
        <p>澳廣就《Race Around the World》裡一段諷刺內容道歉，並把相關素材從平台下架。澳廣申訴專員認為該片段沒有違反編輯規範，但管理層表示它仍未達到社區期待，並承諾會調整政策。這件事重要，因為諷刺、編輯判斷與公共廣播標準同時被推到聚光燈下。接下來要看的，是內部審查會不會進一步收緊對爭議內容的審批。</p>
