        <h1>昆士蘭的維多利亞公園奧運方案進入下一階段</h1>
        <p>昆士蘭公布了布里斯本2032年維多利亞公園賽區的最新概念圖，內容包括新體育場、國家水上中心、橋樑和擴大的公共空間。這個方案重要，因為它決定了奧運片區的基本形態，也影響這座市中心公園未來如何使用。支持者認為它會留下長期遺產，批評者則說選址昂貴、進出不便，而且交通和觀眾疏導細節仍然不足。接下來要看預算和前期工程能否按計畫推進。</p>
