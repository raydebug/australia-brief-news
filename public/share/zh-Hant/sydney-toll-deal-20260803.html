        <h1>雪梨通行費下調，減負要到明年才開始</h1>
        <p>新南威爾士州政府表示，雪梨幾條通行費將從明年起下降，這是與營運商達成新協議後的結果，Lane Cove Tunnel、M2 和 Cross City Tunnel 的收費都會降低。這個方案重要在於，它承諾替通勤者減輕負擔，但並沒有取消收費道路體系。接下來要關注的是節省究竟有多少能真正落到日常駕駛者身上，以及收費改革在實施前是否還會遇到政治阻力。</p>
