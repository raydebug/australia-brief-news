        <p>關於收入支持的報導顯示，每天大約 68 澳元的補助會迫使一些人省掉正餐、減少用藥，也讓房租更難負擔。報導引用的調查數據指出，領取 JobSeeker 的人比一般人更可能一天只吃一餐，甚至更少。更廣泛的意義在於，過低的補助水準會把壓力轉嫁到食物救濟、醫療與住房服務上。政策問題仍然是，補助能否提高到足以阻止這種下滑。</p>
