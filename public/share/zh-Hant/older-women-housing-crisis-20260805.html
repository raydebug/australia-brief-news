        <h1>年長女性正被更深地擠入住房危機</h1>
        <p>昆州最新報導顯示，隨著租金上漲和積蓄見底，越來越多年長女性開始求助支援機構。很多人獨自生活、住房安全感很弱，或者剛經歷關係破裂，稍有延誤就可能被推向無家可歸。接下來要看政府會不會把臨時收容、租金援助和長期住房供應一起補上，否則等待名單只會繼續拉長。</p>
