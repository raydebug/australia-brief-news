        <h1>坎培拉收緊人工智能資料中心規則</h1>
        <p>聯邦政府正準備為新建人工智能資料中心設下更嚴格的用電規則。方案要求營運方證明自己會把足夠電力回輸電網，並排除完全依賴天然氣的項目。之所以重要，是因為資料中心擴張正在和電網容量、州屬審批以及土地使用壓力正面碰撞。接下來要看坎培拉能否把這套框架落地，同時又不把投資嚇走。</p>
