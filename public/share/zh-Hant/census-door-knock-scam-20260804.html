        <h1>澳統計局警告普查前警惕上門騙子</h1>
        <p>澳大利亞統計局提醒民眾，在8月11日普查前要提防冒充普查人員上門的人。真正的工作人員不會索要銀行資料、密碼或其他敏感資訊。這個提醒很重要，因為普查會影響學校、醫療和基礎設施規劃，騙局會在調查開始前就削弱信任。接下來要靠更多公開提醒和對可疑上門行為的及時舉報。</p>
