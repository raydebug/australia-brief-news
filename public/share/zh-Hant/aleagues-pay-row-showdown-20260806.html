        <h1>A聯賽勞資糾紛正走向攤牌</h1>
        <p>A聯賽與球員工會在新集體協議上仍然僵持不下，舊協議已在6月30日到期。最新方案包括提高女足薪資上限，並為更全面的職業化設下路線圖，但球員方面認為，這個過程已經傷害互信，而且聯盟在公開溝通上太過倉促。這很重要，因為這場爭議會影響薪資、球季穩定性，以及女足聯賽未來的運作方式。下一步是球員仔細審議提案，並決定是否仍保留採取勞工行動的空間。</p>
