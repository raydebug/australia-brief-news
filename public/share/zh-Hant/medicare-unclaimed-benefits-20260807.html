        <h1>澳大利亞人被提醒查核2.745億澳元未領取的 Medicare 福利款</h1>
        <p>Services Australia 表示，97.4萬名澳大利亞人共被欠下2.745億澳元未支付的 Medicare 福利款，平均每人約280澳元。資金之所以還在帳戶裡，是因為銀行卡資料沒有更新。這則消息重要在於，許多人只要補正 Medicare 帳戶資訊，就可能在幾天內拿回這筆錢。隨著申領增加和紀錄更新，欠款總額還會繼續變化。</p>
