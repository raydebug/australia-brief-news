        <h1>新州在 Bondi 之後讓更多危機來電先由臨床人員接手</h1>
        <p>新南威爾士州正在把更多心理危機來電交給臨床人員先行分流，health-led response 的角色會更大。這個變化來自 Bondi Junction 事件的調查，也與 NSW Ambulance 內部的虛擬轉介中心計畫相連；如果存在安全風險，警方仍會介入。這個做法的重要性在於，它試圖在第一接觸點減少升級，並讓情緒危機中的人更快得到醫療回應。真正的考驗是項目能否迅速落地、運行順暢，並擁有足夠人手。</p>
