        <h1>Omar Musa以《Fierceland》贏得邁爾斯·富蘭克林獎</h1>
        <p>Omar Musa憑小說《Fierceland》贏得2026年邁爾斯·富蘭克林文學獎，拿下六萬澳元獎金。這部作品圍繞家庭關係、繼承，以及婆羅洲雨林遭受破壞展開，也讓澳洲最重要的小說獎再次把東南亞澳洲敘事推到舞台中央。Omar Musa說，這本書來自多年累積，也與他對該地區的個人連結有關，評審則特別指出作品把節奏、政治與生態損失結合了起來。接下來要看這本書在得獎消息之外能接觸多少讀者。</p>
