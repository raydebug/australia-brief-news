        <h1>博彩公司否認用毒品和陪侍誘導下注</h1>
        <p>參議院對博彩改革的審查聽到指控稱，一些博彩公司曾提供毒品、酒精和陪侍服務，以留住高價值客戶繼續下注。Sportsbet 和 Tabcorp 否認了這些說法，並表示如果有證據，應該交給執法部門。這件事之所以重要，是因為它直接關係到政府正在推動的博彩廣告改革，而議員們也在權衡現行法案是否足以遏制誘導獎勵和面向兒童的廣告。調查定於 8 月 17 日提交報告，接下來要看聽證會是否會推動更嚴格的規則或正式調查。</p>
