        <h1>Tony Burke延後削減移民計畫，工黨重排簽證優先順序</h1>
        <p>Tony Burke延後了國家新聞俱樂部的宣布，同時工黨也在重排技術簽證處理順序，把部分臨時申請人往前提。這項舉措的目標是放慢淨海外移民成長，而圍繞移民規模的壓力，正來自聯盟黨和一國黨。政策細節仍然關鍵，因為它會影響誰能留下、誰要等待更久，以及政府能多快減少入境人數。接下來要看的是改期後的聲明，以及隨後公布的具體條文。</p>
