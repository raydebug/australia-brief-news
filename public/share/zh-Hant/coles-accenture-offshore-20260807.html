        <h1>Coles 透過與 Accenture 的協議推動辦公室工作外包海外</h1>
        <p>Coles 正在推進一項與 Accenture 的協議，把企業內部工作轉移到海外，財務、技術、人力資源和市場行銷都可能受到影響。報導顯示，受影響職位可能從數百個到 1000 個以上不等，不過門市營運不在計畫之內。這件事重要，是因為它顯示澳洲大型雇主正在借助外包和由 AI 推動的重組來壓低成本。下一步要看最終裁員數量，以及工會、員工和投資人如何回應。</p>
