        <h1>Kmart 的廉價相機眼鏡引發隱私警告</h1>
        <p>Kmart 的 89 美元 Anko 相機眼鏡已售罄，將一副廉價的可穿戴相機送到更多澳洲人手中。這款眼鏡可以錄製影片和靜態影像，隱私倡導者表示，這使得在商店、交通和其他公共場所未經同意的情況下拍攝人們變得更容易。這很重要，因為該設備降低了秘密錄音的成本，而隱私規則仍在不斷改進。下一個問題是零售商、監管機構和購物者是否將其視為正常的小工具或新的監控問題。</p>
