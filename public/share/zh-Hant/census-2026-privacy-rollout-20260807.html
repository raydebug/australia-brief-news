        <h1>澳洲2026年人口普查面臨隱私質疑和未收到紙本指引的投訴</h1>
        <p>2026年人口普查定於8月11日進行，澳洲統計局正要求各家各戶透過線上或紙本方式完成填報。與此同時，有人反映自己仍未收到指引，這又加重了圍繞新設性別、性傾向和祖先問題的隱私擔憂。它之所以重要，是因為人口普查資料會直接影響全國的資金分配和公共服務規劃。接下來要看的是，統計局能否在普查夜之前把說明送到位，避免出現大範圍混亂。</p>
