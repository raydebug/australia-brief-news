        <h1>堪培拉收緊促使科技平台為新聞付費的規則</h1>
        <p>堪培拉收緊了讓大型科技平台為新聞付費的方案。如果企業沒有與足夠多的本地出版機構達成協議，就可能按澳洲數位廣告收入繳納 2.5% 的徵收費。領英也被納入適用範圍，政策重點仍是逼平台與澳洲媒體談成商業合作。它的重要性在於，這會影響新聞業的收入來源，也會決定大型平台還能保留多少議價空間。接下來要看國會是否通過草案，以及最終條文還會不會再調整。</p>
