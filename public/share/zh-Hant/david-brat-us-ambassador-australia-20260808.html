        <h1>David Brat將接任美國駐堪培拉大使</h1>
        <p>美國參議院已經確認 David Brat 出任下一任美國駐澳大利亞大使，這個職位已經空缺了數個月。這項任命之所以重要，是因為華盛頓與堪培拉仍在處理關稅、國防協調和 AUKUS 帶來的壓力。Brat 表示他想把重點放在貿易、關鍵礦產和安全關係上，下一步就看他何時前往堪培拉。</p>
