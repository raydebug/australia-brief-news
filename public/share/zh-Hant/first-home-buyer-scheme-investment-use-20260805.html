        <h1>首置業擔保計劃被質疑被部分買家轉作投資房</h1>
        <p>《衛報》的一篇分析顯示，澳洲5%首置業擔保計劃中，近1500套房產後來被轉成了投資房。報道說，在取消收入上限後，申請量明顯上升，月度成交一度超過5600套。之所以重要，是因為這項計劃原本是幫助自住買家入市，而不是給投資者留出另一條入口。接下來要看，聯邦政府會不會收緊審核，還是維持現有規則。</p>
