        <h1>維州反腐機構稱安德魯斯政府在消防員工會談判中越線</h1>
        <p>維州反腐機構公布了拖延已久的 Operation Richmond 報告，認為前安德魯斯政府的高層在與消防員工會的往來中存在嚴重且令人擔憂的行為。委員會沒有證實圍繞此案流傳的勒索說法，但指出部長和官員處理敏感資訊、參與談判的方式沒有達到應有標準。這個結論重要，因為它觸及的是維州一場最敏感的勞資衝突裡，公共權力究竟是如何被使用的。接下來要看的是，這份報告會不會帶來實際改革，還是只引發新一輪政治爭論。</p>
