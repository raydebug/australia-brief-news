        <h1>一國黨維州造勢引發對媒體封鎖的爭議</h1>
        <p>One Nation公布了首批維州州選候選人，同時Pauline Hanson將ABC、《衛報》和《時代報》排除在發布會之外的做法持續引發爭議。Warren Pickering領軍維州戰線，名單裡既有前自由黨人士，也有地方候選人，顯示該黨正試圖在州選前站穩腳跟。這則消息重要在於，它同時凸顯一國黨的選舉野心，以及對媒體曝光的控制意圖。接下來要看他們能否在選戰真正展開前拿出更清楚的政策說明。</p>
