        <h1>聯邦政府收緊危險電動自行車進口規則</h1>
        <p>政府將要求澳洲競爭與消費者委員會制定全國性的電動自行車安全標準，適用於 e-bike、e-scooter 和 e-skateboard。方案會限制功率和速度，目標是阻止那些與傷亡有關的高功率設備繼續擴散。之所以重要，是因為這類車輛已經很常見，而州和領地現行規則還不足以擋住危險型號流入市場。接下來要看新標準能否盡快完成，並在各州和領地落實。</p>
