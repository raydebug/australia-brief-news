        <h1>雪梨跑道險情讓機場安全再次受到審視</h1>
        <p>Airservices Australia 表示，在澳洲運輸安全局調查雪梨一起跑道險情期間，安全仍是首要任務。這起事件之所以重要，是因為飛機在地面上過於接近時，跑道事故可能迅速升級。ATSB 仍在評估這類險情有多常見，以及哪些環節需要改變。對乘客來說，關鍵不只是這一次事件，而是防止下一次事故的整套系統。</p>
