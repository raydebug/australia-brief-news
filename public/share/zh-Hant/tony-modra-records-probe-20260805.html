        <h1>南澳衛生部門把 Tony Modra 病歷調查擴大到九名員工</h1>
        <p>南澳衛生部門表示，在有人不當查看 Tony Modra 的醫療紀錄後，又有第九名員工被列入調查範圍。Modra 在卡車事故後住院治療，這起事件說明，隱私失誤很容易從一個人擴散成整個醫療系統的信任危機。部門表示，審計已經發現這些存取行為，相關處分仍有可能啟動。接下來要看調查結果，以及衛生部門是否會收緊紀錄權限。</p>
