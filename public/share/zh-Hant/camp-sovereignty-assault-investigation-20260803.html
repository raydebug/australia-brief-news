        <h1>維多利亞警方正在調查涉嫌在墨爾本內陸主權營地發生的襲擊事件</h1>
        <p>維多利亞警方正在調查墨爾本內城區主權營地發生的一起涉嫌襲擊事件，一名37歲的男子因面部受傷接受治療。該地點是原住民抗議營地，警方表示他們正在調查夜間發生的事情。這很重要，因為該營地之前就已經成為攻擊目標，任何結論都可能影響當局如何應對仇恨驅動或政治色彩的攻擊。警方尚未宣布指控，調查仍在進行中。</p>
