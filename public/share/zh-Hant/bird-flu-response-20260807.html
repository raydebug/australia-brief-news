        <h1>澳洲的禽流感應對從聖誕島擴展到野生動物風險警示</h1>
        <p>聯邦政府將撥款超過 70 萬澳元，為聖誕島可能出現的 H5 禽流感疫情做準備；同時，新的風險評估顯示，如果病毒擴散，數百種本地鳥類和哺乳動物都將面臨高風險。這很重要，因為澳洲的應對正在從籠統警告轉向對偏遠島嶼設施和脆弱野生動物的具體準備。接下來要看的是，生物安全和棲息地保護能否在病毒擴散到更多地區之前迅速加強。</p>
