        <h1>高院恢復了 Emma Lovell 案更重的刑期</h1>
        <p>高等法院恢復了殺害布里斯本母親 Emma Lovell 的男子所應承擔的更重懲罰。案件爭點在於，這名作案時17歲的少年後來承認謀殺及相關罪名後，原本被縮短的假釋期是否合理。這個裁決很重要，因為它會繼續影響昆州對青少年犯罪的討論，也說明法院在衡量「特殊情況」時會把嚴重殺人案看得多重。接下來，家屬仍在等待更完整的交代，而量刑爭論也會繼續延伸到政治和司法層面。</p>
