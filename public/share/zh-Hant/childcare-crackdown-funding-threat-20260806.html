        <h1>澳洲托兒所整治從提醒升級到資金威脅</h1>
        <p>教育監管部門正把對托兒機構的整治從提醒升級為資金威脅。最新一季裡，超過60家托兒中心收到整改通知，近600家服務機構因不達標被關閉。聯邦政府表示，需要更強的執法來阻止反覆違規，並更快地保護兒童安全，機構也會更快被追責。這之所以重要，是因為托兒安全已經變成監管、撥款和公眾信任的現實考驗。下一步要看是否會有更多機構被點名，以及是否有人被切斷聯邦資金。</p>
