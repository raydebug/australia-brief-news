        <h1>澳洲長者的私保帳單將繼續上升</h1>
        <p>聯邦政府仍在推動調整方案，要把65歲以上澳洲人的額外私保補貼收窄，許多人從2027年4月起將看到保費上升。政府把這項改動描述為改按收入而不是年齡發放補貼，並把省下的資金轉去支援長照。爭議在於，批評者擔心更多長者會放棄私保，把壓力重新推回公立醫院；政府則認為這是一筆無法再拖的預算取捨。</p>
