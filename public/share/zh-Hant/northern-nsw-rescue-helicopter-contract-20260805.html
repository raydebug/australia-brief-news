        <h1>新州北部救援直升機合約再受檢視</h1>
        <p>一次議會調查讓新州北部的救援直升機服務再次承壓，報告提到霸凌、虐待和營運管理等嚴重問題。委員會認為，除非安全隱憂得到解決，NSW Ambulance 不應延長這份合約。這個決定很重要，因為該服務是大片偏遠地區急救網路的一部分，一旦受影響，轉運和救援時間都可能變長。新州政府現在有三個月回應調查建議。</p>
