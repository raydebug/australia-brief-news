        <h1>ICAC 調查擴大對佩羅特派系和金流的追查</h1>
        <p>新南威爾士州反腐聽證會上，證詞顯示 Jean-Claude Perrottet 在一名自由黨議員的辦公室任職期間也在做派系工作；錄音通話和簡訊則讓捐款與拉票式分支操作再次受到質疑。這個問題之所以重要，是因為它關係到黨務、捐款和納稅人資助的職位是否被混在一起。後續還有更多證人出庭，調查可能重塑新州自由黨的內部權力與財務處理方式。雖然尚未證明任何人有罪，但壓力還在持續累積。</p>
