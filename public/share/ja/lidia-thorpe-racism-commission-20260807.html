        <h1>リディア・ソープ氏、全国的な人種差別調査を支持</h1>
        <p>リディア・ソープ氏は、アボリジナルとトレス海峡諸島民への人種差別を調べる独立した王立委員会の設置を支持しました。政治、メディア、公共生活における人種差別についての証言を聞く議会調査と並行して、この動きが強まっています。これは、証言だけで終わらず、より強い権限と広い範囲を持つ正式な調査に進む可能性があるから重要です。今後の焦点は、政府が調査範囲を広げるのか、それとも現行の見直し手続きを維持するのかです。</p>
