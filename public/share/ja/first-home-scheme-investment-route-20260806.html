        <h1>オーストラリアの5％頭金制度が投資目的で使われている</h1>
        <p>2020年から2026年5月までに、この5％頭金制度で購入された住宅のおよそ1500件が投資用不動産に変わっていたことがわかりました。本来は政府保証で住宅価格の95％まで借りられる制度ですが、データでは高所得層の利用も見えています。制度がなお拡大している一方で、住宅価格の圧力は地域差が大きく、政策当局は本当に初めての購入者を助けているのか、それとも投資家の借り入れを後押ししているのかを見極める必要があります。次の焦点は、政府が対象条件や申告、監視を強めるかどうかです。</p>
