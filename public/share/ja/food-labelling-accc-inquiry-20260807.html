        <h1>スーパーの食品表示をめぐる疑惑でACCCが調査</h1>
        <p>Four Corners で原産国表示の虚偽や汚染製品に関する疑惑が報じられた後、ACCC が調査を始めた。規制当局は、それが消費者法に反するのか、買い物客を誤解させたのかを確かめることになる。食品表示は、スーパーの供給網への信頼と購買判断を左右するため、この問題は重要だ。次の焦点は、調査が執行措置につながるか、それとも表示ルール全体の見直しに広がるかだ。</p>
