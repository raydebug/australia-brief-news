        <h1>シドニー空港が管制要員不足で大幅遅延</h1>
        <p>シドニー空港では、Airservices Australia が管制要員の不足を受けて流れを制御したため、出発と到着に大きな遅れや欠航が出ました。Qantas、Jetstar、Virgin、Rex の便が影響を受け、機内や駐機場で長く待たされた乗客もいました。重要なのは、主要な交通拠点の混乱が全国の航空網にすぐ波及することです。制限は解除されましたが、次の山場までに人員配置を強化できるかが焦点です。</p>
