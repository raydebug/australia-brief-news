        <h1>オーストラリアの保育規制は警告から資金停止の圧力へ</h1>
        <p>保育施設への対応は、警告段階から資金停止の圧力へと移っています。最新の四半期では、60を超える保育施設に通知が出され、基準を満たさないサービスは約600件が閉鎖されました。連邦政府は、繰り返しの違反を止めて子どもを守るには、より強い執行が必要だと説明しており、事業者にも早く責任が問われることになります。これは、保育の安全が規制、資金、公的信頼を同時に試す問題になっているからです。次の焦点は、さらに多くの事業者が名指しされるか、連邦資金を失う施設が出るかどうかです。</p>
