        <h1>戦死から数十年、豪州兵2人の身元が判明</h1>
        <p>オーストラリア軍の戦没者身元確認作業で、長年「身元不明のオーストラリア兵」として埋葬されていた2人の身元が判明しました。1人は1918年のフランスで、もう1人は1942年のパプアニューギニアで亡くなっており、今後はそれぞれの墓に名前の入った墓碑が置かれます。遺族にとってはようやく答えが得られる出来事であり、歴史の空白を埋める作業が今も続いていることを示します。今後も古い記録や埋葬地の照合が進めば、さらに身元が判明する可能性があります。</p>
