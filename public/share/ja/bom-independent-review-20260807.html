        <h1>BOMがサイトと予報への批判を受け独立調査を開始</h1>
        <p>Bureau of Meteorology は、ウェブサイトや予報ツール、農家との情報共有をめぐる批判を受け、独立調査を始めました。調査では、豪州の人々が実際に使える形で気象情報を提供できているかが問われます。気象データは、農業の判断、災害対策、日々の生活を支える基盤だからです。次の焦点は調査報告と、それがサイトやサービス改善につながるかどうかです。</p>
