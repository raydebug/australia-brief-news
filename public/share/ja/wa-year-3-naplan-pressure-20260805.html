        <h1>西オーストラリア州の3年生NAPLAN結果が初期算数への警戒を強める</h1>
        <p>西オーストラリア州の最新NAPLAN結果では、3年生の算数が改めて注目され、約4割の児童が期待水準に届いていません。初期段階の学力差は、早く手を打たないと後で広がりやすいからです。9年生の成績は比較的強く、問題が州全体ではなく低学年に集中していることを示しています。今問われるのは、学校と州政府がこの結果をどう支援策につなげるかです。</p>
