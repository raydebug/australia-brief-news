        <h1>NAPLAN低下で紙のテスト復活論が再燃</h1>
        <p>最新のNAPLAN結果で全国の読み書きと算数が弱かったことを受け、教育相たちは再び紙の試験に戻す案を検討しています。全体の約3分の1が基準に届かず、読解は全学年で2025年を下回り、3年生の算数もなお課題が残りました。これは、デジタル試験、教室での支援、画面時間の影響をめぐる議論を再び前面に押し出す出来事です。今後は、各州の大臣が結果を受けてNAPLANの実施方法を変えるかどうかが焦点です。</p>
