        <h1>Bondi 後、NSW は危機通報で臨床職員を前面に</h1>
        <p>ニューサウスウェールズ州は、より多くのメンタルヘルス危機通報を臨床職員が先に仕分けする方向へ動いています。これは Bondi Junction の事件調査を受けた動きで、NSW Ambulance の仮想ハブ構想ともつながっています。危険が高い場合は警察が引き続き対応しますが、狙いは最初の接点でのエスカレーションを減らし、より早く医療対応につなげることです。実際の試金石は、必要な人員を確保しながら速やかに運用できるかどうかです。</p>
