        <h1>家計支出が伸び、EV購入が回復</h1>
        <p>オーストラリアの家計支出は6月に0.8%増え、新車購入の伸びと電気自動車販売の回復が支えた。重要なのは、生活費の圧迫がある中でも消費が続いていること、そして交通の選択が月次統計に影響していることだ。航空旅行の支出も以前の弱さから戻っており、家計の一部は大型支出に踏み切っている。今後の焦点は、燃料や物価の圧力が落ち着いた後もこの勢いが続くかどうかだ。</p>
