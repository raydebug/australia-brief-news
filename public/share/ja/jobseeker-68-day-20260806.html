        <h1>JobSeekerで暮らすことは今も生活費の大きな試練だ</h1>
        <p>豪州では、JobSeeker受給者が1日およそ68ドルで暮らすことを求められており、連邦予算でも基礎額は引き上げられていない。報道は、家賃、食費、交通費が最も重い負担だと伝え、支援団体はこの給付では最低限の生活費すら賄えないと指摘している。これは、議論がインフレだけでなく貧困そのものに向かっていること、そして物価指数連動だけでは追いつけるのかという問いにつながる。次の判断は、政府が給付額を見直すのか、それとも据え置くのかだ。</p>
