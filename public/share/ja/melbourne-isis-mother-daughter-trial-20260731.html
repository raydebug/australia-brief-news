        <h1>メルボルン裁判所、ISIS関連の母娘を公判へ</h1>
        <p>メルボルンの裁判所は、シリア滞在中に関わったとされる奴隷化の罪で、カウサル・アハマドと娘のゼイナブ・アハマドを公判に付すことを決めました。検察は、2人の家族がイスラム国に関わり、ヤジディの少女を支配していたと主張しています。事件はビクトリア州最高裁に移り、8月21日に審理が予定されています。重要なのは、イスラム国崩壊期に起きたとされる犯罪を、オーストラリアの裁判所がどう扱うかを示す点です。次は、公判前手続きで証拠と容疑が検証されます。</p>
