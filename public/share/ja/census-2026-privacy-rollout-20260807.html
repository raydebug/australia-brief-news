        <h1>2026年国勢調査、プライバシー懸念と配布遅れの訴え</h1>
        <p>2026年の国勢調査は8月11日に実施予定で、オーストラリア統計局は各世帯にオンラインまたは紙での回答を求めています。ところが、まだ案内を受け取っていない人がいるという報告があり、新しい性別や性的指向、祖先に関する項目をめぐってプライバシーの不安も続いています。国勢調査の結果は、医療や教育、交通などの計画に直結するため重要です。統計局が調査前に案内を十分に届け、混乱を抑えられるかが焦点です。</p>
