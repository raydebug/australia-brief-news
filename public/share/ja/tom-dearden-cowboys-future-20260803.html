        <h1>Tom Dearden、カウボーイズ退団の憶測を拒否</h1>
        <p>Tom Deardenはノース・クイーンズランド州に引き続きコミットしており、契約は2029年まで見守るつもりだと述べ、カウボーイズ退団を望む話を一蹴した。この話が重要なのは、怪我や家族の計画を経て噂が彼を追っており、一つの選手の決断がより広範な契約の話に変わったからである。今のところ、彼の立場に変化はない。彼は留まると言っており、次の問題は、彼の将来を巡る雑音が最終的に収まるかどうかだ。</p>
