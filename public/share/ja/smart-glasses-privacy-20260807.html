        <p>内蔵カメラ付きの低価格スマートグラスが広がる中、オーストラリアではプライバシー監視が強まっています。政府側は便利さを認めつつも、人目を避けた撮影や嫌がらせを簡単にし、特に公共の場で問題になりうるとみています。価格が下がる一方で、プライバシー規制はまだ追いついていないことが重要です。今後は現行法で足りるのか、新しい制限が必要なのかが問われます。</p>
