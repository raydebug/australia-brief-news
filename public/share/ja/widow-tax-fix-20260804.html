        <h1>労働党、次の税制パッケージ前に未亡人税の穴埋めへ</h1>
        <p>労働党は、批判を浴びた「未亡人税」と呼ばれる税制の穴を埋めようとしている。死亡や離婚の場面でも、予定されていたキャピタルゲイン税とネガティブ・ギアリングの扱いをきちんと適用する狙いだ。共有名義の投資物件は、関係の終わりや配偶者の死で抜け穴に巻き込まれやすいため、この修正は重要になる。財務省は草案への意見募集を8月21日まで続けるとしており、焦点は救済策が古いルールの影響が出る前に固まるかどうかだ。</p>
