        <h1>シャークベイ近郊の事故で家族旅行が悲劇に</h1>
        <p>シャークベイ近くでユーティリティ車どうしが衝突し、男性2人が死亡、さらに2人が重傷を負った。警察によると、事故は月曜午前11時半ごろ、ノースウェスト・コースタル・ハイウェイで起き、50代の女性と12歳の子どもがパースへ搬送された。遠隔地の道路では救助が届く前に重症化しやすいため、この事故は重大だ。今後は、速度、疲労、路面状況のどれが原因だったのかを調べる必要がある。</p>
