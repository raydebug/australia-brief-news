        <h1>オーストラリアがニコチンパウチの取り締まりを強化</h1>
        <p>オーストラリア政府は、店頭やネット販売で広がるニコチンパウチへの取り締まりを強めている。製品は隠しやすく使いやすい一方、若い世代に広がりつつあり、健康被害を抑えにくくしている。禁令の狙いは、新しいニコチン習慣が広がる前に止めることだ。今後は、執行や国境検査、小売店の順守が実際に効くかが焦点になる。</p>
