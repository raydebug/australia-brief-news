        <h1>グレートサザンの農家は雨を待ちながら8月に入った</h1>
        <p>西オーストラリア州グレートサザンでは、7月の雨がかなり少なく、農家は雨待ちのまま8月を迎えています。土壌の水分は減り続け、特に内陸ではため池や水の備えに圧力がかかっています。次のまとまった雨は作物、家畜、ダムにとって重要ですが、予報ではまだ回復はまちまちです。</p>
