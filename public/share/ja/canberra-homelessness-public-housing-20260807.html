        <h1>キャンベラの住宅待機がホームレス増加を招く</h1>
        <p>キャンベラの支援団体は、公営住宅の待機列のせいで、住める場所が見つからない人が増えていると訴えています。最新報道では、承認済み申請者が約3,600人おり、優先案件でも数か月、通常の住宅では5年以上待つケースがあるとされています。問題は緊急の宿泊先だけではなく、公営住宅が空くまで家族や単身者がどれだけ生活を保てるかです。供給が改善しなければ、地元の支援機関がこの負担を抱え続けることになります。</p>
