        <h1>ABCが風刺映像をめぐって謝罪し、論争が広がる</h1>
        <p>ABCは、Race Around the World の風刺的な映像をめぐる苦情を受け、対象素材を削除したうえで謝罪した。オンブズマンは編集基準違反ではないとしたが、経営陣は社会的期待に届かなかったとして方針見直しを約束した。これは、風刺、編集判断、公共放送の基準が同時に問われているため重要だ。次に注目すべきは、内部審査が争点のある素材の承認ルールをより厳しくするかどうかだ。</p>
