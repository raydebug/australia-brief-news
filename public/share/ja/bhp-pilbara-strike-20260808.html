        <h1>BHPのピルバラ鉄鉱石輸送がストで揺れる</h1>
        <p>西オーストラリア州ポートヘッドランドのBHPの輸出拠点で、賃金と労働条件をめぐる2日間の争議が始まりました。約150人の労働者が参加し、国内最大級の鉄鉱石輸出港で荷役や関連業務が止まる見通しです。昨年度は数億トン規模の輸出があり、短い停止でも収益や州のロイヤルティ、海外顧客に波及する可能性があります。交渉は8月18日に再開予定ですが、賃上げの幅と時期ではまだ隔たりがあります。</p>
