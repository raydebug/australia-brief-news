        <h1>ブリスベンでホームレスの子どもが1500人超</h1>
        <p>Brisbane Zero の最新データでは、前会計年度にブリスベン市内で984世帯、1,539人の子どもがホームレスと確認された。多くの世帯がひとり親の母親世帯で、住宅難が家族の離散につながる速さを示している。これは都市の住宅危機を抽象的な問題ではなく、測定可能な現実として示す点で重要だ。今後は、政府と支援団体がこの数字をより安定した住まいへの道筋に変えられるかが焦点になる。</p>
