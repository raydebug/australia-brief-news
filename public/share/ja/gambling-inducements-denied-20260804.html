        <h1>賭け会社、薬物や接待提供の疑いを否定</h1>
        <p>上院の賭博改革審査では、一部の賭け会社が高額客を引き留めるために薬物、酒、接待を提供したとの主張が取り上げられた。Sportsbet と Tabcorp はその疑惑を退け、証拠があるなら当局に回すべきだとした。重要なのは、この問題が政府の賭博広告改革に直結しており、現行案で誘導的な特典や子ども向け広告を抑えられるのかが問われていることだ。審査は8月17日に報告予定で、今後は規制強化や正式な捜査に進むかが焦点になる。</p>
