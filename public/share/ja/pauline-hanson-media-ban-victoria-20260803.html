        <h1>ハンソン氏の取材制限が報道の自由論争を呼ぶ</h1>
        <p>ハンソン氏は、ビクトリア州での記者会見から主要メディア数社を締め出し、その後それを不公平な報道への一時的な警告だと説明した。問題は、ワンネーションが候補者発表を進め、州政で存在感を高めようとしていた時期に起きた。誰を会場に入れるかを政治家が選べるのかという、取材のアクセスと監視の基本問題が問われている。ハンソン氏は禁令が永久ではないと述べたが、批判自体は取り消していない。</p>
