        <h1>シドニーの通行料金引き下げ、実施は来年以降</h1>
        <p>ニューサウスウェールズ州政府は、運営会社との新たな合意の下で、シドニーの複数の有料道路料金が来年から下がるとしている。Lane Cove Tunnel、M2、Cross City Tunnel の料金が引き下げられる予定だ。重要なのは、料金道路そのものをなくさずに通勤者の負担を軽くすると約束している点だ。今後は、実際にどれだけの節約が一般ドライバーに届くのかが問われる。</p>
