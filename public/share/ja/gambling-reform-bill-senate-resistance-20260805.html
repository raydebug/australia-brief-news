        <h1>労働党の賭博改革案は上院で反発に直面</h1>
        <p>連邦政府の賭博改革パッケージは、上院で反発を受けています。連立野党、緑の党、そして複数の無所属議員が、広告と誘導策へのさらなる厳格な規制を求めています。争点は審問での証言とも重なっており、賭博会社が高額顧客に薬物や性労働者を提供したという主張が出ていますが、各社は否定しています。重要なのは、労働党が賭博規制を強めつつ、法案全体の主導権を保てるかどうかです。次は、8月17日の報告前に十分な支持を得るため、政府がどこまで修正するかです。</p>
