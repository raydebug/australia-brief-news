        <h1>ABCの調査部門トップが退任し、Four Cornersを巡る審査が緊迫</h1>
        <p>ABCが一部の調査番組の正確性を再点検する中、調査部門の責任者がABCを離れる。退任は、ABCが複数の素材を取り下げ、問題視された報道の扱い方に対する疑問が高まる最中に起きた。これは、オーストラリアでもっとも注目される公共利益ジャーナリズムの一角の信頼性に関わるため重要だ。再点検が、編集の確認強化や人員配置の見直しにつながるかが焦点だ。</p>
