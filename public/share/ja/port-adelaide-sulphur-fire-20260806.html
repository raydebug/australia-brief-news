        <h1>ポートアデレードの有毒な硫黄火災で避難命令</h1>
        <p>ポートアデレードの工業用倉庫で火災が起き、約3万トンの硫黄から有毒な煙が発生した。救急当局は1キロ圏内の住民に避難を命じ、2人の作業員が病院に搬送され、火はその後制御された。煙が地域の健康に危険を及ぼしたうえ、現場には大量の危険物が保管されていたため、この事件は重要だ。今後は、出火原因と追加の環境調査が必要かどうかが調べられる。</p>
