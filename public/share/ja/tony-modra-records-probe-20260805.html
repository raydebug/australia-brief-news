        <h1>Tony Modraの診療記録調査、対象は9人に拡大</h1>
        <p>SA Health は、Tony Modra氏の医療記録を不適切に閲覧した疑いを受け、調査対象が9人目の職員にまで広がったと発表した。モドラ氏はトラック事故の後に治療を受けており、この件は個人のプライバシー侵害を超えて、医療制度全体への信頼問題になっている。監査で不正アクセスが見つかったとされ、懲戒処分の可能性も残っている。今後は調査の結果と、記録管理がより厳しくなるかが焦点だ。</p>
