        <h1>豪州のEV販売がまた月間記録を更新</h1>
        <p>7月の新車販売は再び記録を更新し、電気自動車、ハイブリッド、プラグインハイブリッドが市場を押し上げました。新車は10万8千台超が売れ、低排出車は全体のほぼ半分を占める一方、ガソリン車とディーゼル車の勢いは鈍っています。消費者の選好が想定より速く変わっている一方で、充電網や地方での利用環境はまだ追いついていません。今後の焦点は、販売の伸びにインフラが追随できるかです。</p>
