        <h1>メルボルンの放火事件、極左テロとして扱われる</h1>
        <p>捜査当局は、昨年メルボルンの防衛関連メーカーを狙った放火事件を、極左テロの可能性があるとして扱っています。事件では車両が焼かれ、現場に落書きがされ、さらに同社の武器メーカー向けの仕事を非難する責任声明のような動画も出回りました。重要なのは、もともと器物損壊として始まった案件が、対テロ権限の対象になったことです。警察は関係者の特定を急ぎ、動画がより広い過激派ネットワークを示すのかを調べています。</p>
