        <h1>クイーンズランド州の若者向け収容案に子どもの安全懸念</h1>
        <p>クイーンズランド州で進められている若者向けブートキャンプ計画について、福祉団体と法律団体が、被害が当局に知られない恐れがあると警告しています。計画では、10歳の子どもでも遠隔地の農場に送られる可能性があり、運営者は自己負罪の恐れを理由に虐待の報告を避けられるとされています。法案が通れば最初の施設は9月までに開く予定で、保護策の最終調整はまだ議会で続いています。法案はまだ成立していません。</p>
