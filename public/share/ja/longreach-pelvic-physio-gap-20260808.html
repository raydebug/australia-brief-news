        <h1>Longreachの女性たち、骨盤底理学療法士の退職で遠距離通院へ</h1>
        <p>Longreachでは、地域で唯一の公立 pelvic health physiotherapist が去ったあと、診療のために何時間も移動しなければならない患者が出ています。地方のクイーンズランドでは専門サービスがもともと少ないため、この空白は治療への大きな壁になります。保健当局は補充を進めているとしていますが、同じ専門性を持つ人材になるかはまだ分かりません。次の焦点は、十分な専門性を持つ人が来るのか、それとも一般的な理学療法士で穴埋めするのかです。</p>
