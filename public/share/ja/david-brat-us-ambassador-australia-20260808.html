        <h1>David Bratがキャンベラの米大使職に正式承認</h1>
        <p>米上院は、David Brat氏をオーストラリア駐在の次期大使として承認しました。長く空席だったポストがようやく埋まる形です。今回の人事が重要なのは、ワシントンとキャンベラが関税、防衛協力、AUKUSをめぐる圧力にまだ向き合っているためです。Brat氏は貿易、重要鉱物、安全保障の連携を重視するとしており、次は彼がキャンベラに到着して実務を始める時期です。</p>
