        <h1>トラビス・ヘッドがアラン・ボーダー・メダルを2年連続で獲得</h1>
        <p>トラビス・ヘッドは、オーストラリア代表での好調なシーズンを受けて、アラン・ボーダー・メダルを2年連続で獲得した。アッシュズでの3本のセンチュリーと、全形式での安定した成績が、投票でアレックス・キャリーとミッチェル・スタークを上回る決め手になった。これは、このメダルが依然としてオーストラリアの男子クリケット選手を最もはっきり示す指標だからだ。今後の焦点は、式典の形式をめぐる批判を受けて、Cricket Australia が次回どう表彰するかにある。</p>
