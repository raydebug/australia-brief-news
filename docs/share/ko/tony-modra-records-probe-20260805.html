        <h1>Tony Modra 진료기록 조사, 대상은 9명으로 확대</h1>
        <p>SA Health는 Tony Modra의 의료기록을 부적절하게 열람한 의혹과 관련해 조사 대상이 9번째 직원까지 늘어났다고 밝혔다. 모드라는 트럭 사고 이후 치료를 받았고, 이번 사건은 한 개인의 프라이버시 침해를 넘어 의료 시스템 전반의 신뢰 문제로 번지고 있다. 감사 과정에서 부적절한 접근이 확인됐고, 징계 조치 가능성도 남아 있다. 이제 남은 쟁점은 조사 결과와 기록 접근 통제가 더 엄격해질지 여부다.</p>
