        <h1>Luke Gosling 사건은 연방 검찰로 넘어간다</h1>
        <p>연방 노동당 의원 Luke Gosling에 대한 폭행 혐의는 이해충돌을 피하기 위해 Commonwealth Director of Public Prosecutions가 맡게 된다. 현직 의원이 다시 압박을 받는 가운데 재판 절차는 계속되고 있고, 공직에서 잠시 물러나야 한다는 요구도 커지고 있다. 이제 법적 초점은 분명하다. 기소가 어떻게 진행되는지, 그리고 다음 재판 전까지 정치적 파장이 더 커질지 여부다.</p>
