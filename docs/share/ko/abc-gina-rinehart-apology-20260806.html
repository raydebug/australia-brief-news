        <h1>ABC가 풍자 영상에 사과하면서 논란이 더 커졌다</h1>
        <p>ABC는 Race Around the World의 풍자 영상에 대한 항의를 받은 뒤 해당 자료를 삭제하고 사과했다. ABC 옴부즈맨은 편집 기준 위반은 아니라고 봤지만, 경영진은 사회적 기대에 미치지 못했다고 하며 정책 변경을 약속했다. 이 사안이 중요한 이유는 풍자, 편집 판단, 공영방송 기준이 동시에 시험대에 올랐기 때문이다. 이제 남은 쟁점은 내부 검토가 논란성 있는 자료의 승인 절차를 더 엄격하게 바꾸는지다.</p>
