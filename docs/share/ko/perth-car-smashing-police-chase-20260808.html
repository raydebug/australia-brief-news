        <h1>퍼스 남성, 차량 파손 난동 후 기소</h1>
        <p>퍼스에서 45세 남성이 차를 연달아 훼손한 뒤 기소됐다. 경찰은 약 90분 동안 이어진 난동으로 최소 20대의 주차 차량과 정차 차량이 피해를 입었고, 사건은 여러 교외 지역으로 번졌다고 밝혔다. 다친 사람은 없었지만, 피해 범위가 넓고 공개적이어서 지역 안전 우려가 커졌다. 이제 남은 것은 법원 절차와 그가 왜 이런 일을 벌였는지에 대한 설명이다.</p>
