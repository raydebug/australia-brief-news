        <h1>Optus, 긴급 통화 장애 관련 소송 직면</h1>
        <p>통신 규제당국이 2025년 장애로 긴급 통화 실패와 사망 사건이 이어졌다고 보고 Optus를 상대로 소송을 제기했다. 쟁점은 회사가 고장 뒤 충분히 빠르게 대응했는지, 그리고 triple zero 서비스를 지켜야 할 의무를 다했는지다. 긴급 통신은 네트워크가 믿을 만할 때만 의미가 있다. 법원 판단은 제재 수준과 통신사들의 시스템 강화 압박을 바꿀 수 있다.</p>
