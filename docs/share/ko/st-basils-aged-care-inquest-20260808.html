        <h1>세인트 바질스 요양시설 조사 재개, 기억과 기록이 쟁점</h1>
        <p>코로나로 입주자 50명이 숨진 세인트 바질스 요양시설 참사를 둘러싼 검증이 사건 6주년을 맞아 다시 열렸다. 유족들은 여전히 상실을 잊지 못하고 있고, 당시 관리자 일부는 세부 내용을 떠올리는 데 어려움을 겪고 있다. 이번 사안이 중요한 이유는 요양시설이 팬데믹 최악의 시기에 어떻게 무너졌는지를 따져 묻기 때문이다. 앞으로는 결정 과정과 기록, 책임 소재를 보여주는 추가 증거가 핵심이다.</p>
