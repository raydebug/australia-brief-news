        <p>호주 통계청이 8월 11일 인구조사를 앞두고 조사원을 사칭해 집을 방문하는 사기에 주의하라고 알리고 있다. 진짜 직원은 은행 정보나 비밀번호 같은 민감한 정보를 요구하지 않는다. 인구조사 결과는 학교와 의료, 인프라 계획에 쓰이기 때문에 신뢰가 흔들리면 영향이 크다. 앞으로는 경고를 넓히고 수상한 방문을 얼마나 빨리 신고하느냐가 중요하다.</p>
