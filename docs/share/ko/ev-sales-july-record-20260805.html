        <h1>호주 EV 판매가 또다시 월간 최고치를 찍다</h1>
        <p>7월 신차 판매는 또 한 번 기록을 세웠고, 전기차와 하이브리드, 플러그인 하이브리드가 시장을 끌어올렸다. 한 달 동안 10만 8천 대가 넘게 팔렸고, 저배출 차량은 시장의 거의 절반을 차지했지만 휘발유와 디젤 수요는 둔화했다. 소비자 선택이 예상보다 빠르게 바뀌고 있다는 뜻이지만, 충전망과 지역 접근성은 아직 따라가지 못하고 있다. 다음 관건은 판매 급증에 인프라가 얼마나 빨리 맞춰질 수 있느냐다.</p>
