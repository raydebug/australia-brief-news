        <h1>스마트 글래스가 호주 개인정보 규정에 새 압박</h1>
        <p>당국이 명확한 동의 없이 사람을 촬영할 수 있다고 경고하면서 호주의 개인정보 논쟁이 카메라가 달린 스마트 글래스로 옮겨가고 있습니다. 우려의 핵심은 특히 여성과 아이들이 공공장소에서 자신도 모르게 촬영될 수 있다는 점입니다. 지금의 규정은 값싼 착용형 카메라가 흔해지기 전에 만들어졌기 때문에 이 문제는 중요합니다. 다음 단계는 캔버라가 개인정보법을 더 엄격하게 바꾸거나, 불만과 불안이 커질 때 새 지침을 내놓는지입니다.</p>
