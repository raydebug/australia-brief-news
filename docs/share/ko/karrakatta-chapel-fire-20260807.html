        <p>퍼스의 한 여성이 Karrakatta 묘지 예배당에 불을 질러 징역 5년을 선고받았다. 화재로 340만 호주달러가 넘는 피해가 발생했고 장례 일정이 중단됐으며, 주변 묘지 방화 사건들까지 주목받았다. 이 소식이 중요한 이유는 피해 부담이 결국 지역사회로 돌아가고, 슬픔을 겪는 가족들의 공간이 직접 훼손됐기 때문이다. 이제 초점은 복구 작업과 연관된 방화 수사의 후속 절차다.</p>
