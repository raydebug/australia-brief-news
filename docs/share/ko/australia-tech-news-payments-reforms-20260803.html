        <h1>캔버라, 뉴스 대가를 요구하는 빅테크 규제를 강화</h1>
        <p>캔버라는 뉴스 사용 대가를 요구하는 거대 기술 플랫폼 규제를 더 강하게 만들었다. 충분한 현지 언론사와 계약을 맺지 않으면 호주 디지털 광고 수익의 2.5%를 부과하는 방식이다. 링크드인도 적용 대상에 들어갔고, 핵심은 호주 언론과의 상업 협상을 압박하는 데 있다. 이 규정은 언론 수익과 플랫폼의 협상력을 좌우할 수 있어 중요하며, 이제는 의회가 법안을 어떻게 마무리할지가 관건이다.</p>
