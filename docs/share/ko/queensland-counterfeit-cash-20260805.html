        <p>Australian Border Force는 퀸즐랜드에서 200만 호주달러가 넘는 위조 화폐를 압수했다고 밝혔다. 단일 수입자와 연결된 주내 최대 규모의 위조지폐 적발이다. 위조지폐는 점점 더 알아보기 어려워지고 있고, 항공 화물과 우편을 통해 호주로 들어오는 사례도 늘고 있다. 이번 화물은 아시아에서 왔으며 유통되기 전에 차단됐다. 앞으로는 법의학 분석과 더 큰 공급망 추적이 핵심이다.</p>
