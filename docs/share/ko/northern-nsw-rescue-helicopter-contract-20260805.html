        <h1>NSW 북부 구조 헬기 계약이 다시 도마에 올랐다</h1>
        <p>의회 조사가 NSW 북부 구조 헬기 서비스에 다시 압박을 가하고 있다. 보고서는 괴롭힘, 학대, 운영 방식에 관한 심각한 문제를 지적했다. 위원회는 안전 우려가 해소되기 전까지 NSW Ambulance가 계약을 연장해서는 안 된다고 권고했다. 이 서비스는 넓은 지역의 응급 대응망 일부이기 때문에, 차질이 생기면 이송과 구조 시간이 늦어질 수 있다. NSW 정부는 이제 3개월 안에 답해야 한다.</p>
