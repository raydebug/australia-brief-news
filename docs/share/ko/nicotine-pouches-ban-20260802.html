        <h1>호주, 니코틴 파우치 단속 강화</h1>
        <p>호주 정부가 매장과 온라인 판매를 통해 퍼지는 니코틴 파우치 단속을 강화하고 있다. 이 제품은 숨기기 쉽고 사용하기 쉬운 데다 젊은층으로도 번지고 있어 건강 위험을 더 관리하기 어렵게 만든다. 금지 조치의 목적은 새로운 니코틴 습관이 더 넓게 퍼지기 전에 막는 데 있다. 앞으로는 집행과 국경 검문, 소매업체의 준수 여부가 실제로 효과를 내는지가 관건이다.</p>
