        <h1>노동당의 도박 광고 규제안, 상원에서 난항</h1>
        <p>Labor의 도박 광고 규제안은 Coalition, Greens, 그리고 crossbench 의원들의 반대에 부딪혔습니다. 이 안은 일부 방송 시간대의 광고를 줄이고 홍보와 인센티브 규제를 강화하지만, 비판자들은 더 강한 조치를 원합니다. 이 사안은 도박 피해, 미디어 수익, 상원 표 계산이 한꺼번에 얽혀 있다는 점에서 중요합니다. 앞으로는 정부가 양보할지, 법안을 미루는지, 아니면 약화된 형태로 밀어붙일지가 관건입니다.</p>
