        <p>퀸즐랜드주의 청소년 부트캠프 계획을 두고 복지와 법률 단체들이 당국에 피해가 숨겨질 수 있다고 경고하고 있습니다. 이 계획은 열 살 정도의 어린이까지 외딴 농장으로 보낼 수 있고, 운영자는 자기부죄를 이유로 학대 신고를 피할 수 있다는 우려가 나옵니다. 법안이 통과되면 첫 캠프는 9월까지 문을 열 예정이어서, 최종 보호 장치는 아직 의회에서 논의 중입니다. 법안은 아직 통과되지 않았습니다.</p>
