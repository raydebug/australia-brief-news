        <h1>서류 오류로 한 가족이 호주를 떠나게 됐다</h1>
        <p>한 가족이 정부 서류상의 실수 때문에 호주를 떠나야 했다고 주장하고 있다. 이 사례는 이민과 체류 시스템에서 서류, 기한, 심사에 문제가 생기면 일자리와 학교, 가족 계획이 한꺼번에 흔들릴 수 있음을 보여준다. 행정 실수의 영향은 당사자에게 정책 결정만큼이나 크게 다가올 수 있다. 앞으로는 이 가족이 항소하거나 문제를 바로잡아 다시 돌아올 수 있는지가 관건이다.</p>
