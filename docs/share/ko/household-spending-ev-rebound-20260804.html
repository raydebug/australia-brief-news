        <h1>가계 지출이 늘고 전기차 구매가 되살아나</h1>
        <p>호주 가계 지출은 6월에 0.8% 늘었고, 새 차 구매 증가와 전기차 판매 회복이 이를 이끌었다. 이 수치가 중요한 이유는 생활비 압박 속에서도 소비가 이어지고 있고, 교통 선택이 월별 통계에 영향을 주고 있기 때문이다. 항공 여행 지출도 이전의 약세에서 회복되고 있어 일부 가구는 큰 지출에도 나서고 있다. 앞으로의 핵심은 연료와 전반적인 물가 압력이 가라앉은 뒤에도 이런 흐름이 유지되느냐다.</p>
