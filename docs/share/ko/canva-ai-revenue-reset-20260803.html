        <h1>Canva의 AI 지출로 인해 수익이 거의 재설정되지 않습니다.</h1>
        <p>Canva는 AI로의 전환에 예상보다 비용이 더 많이 들고 결과적으로 수익 목표가 삭감되었다고 말합니다. 이 회사는 호주 최대의 기술 기업 중 하나이고 지출 선택이 고용, 제품 시기 및 투자자 신뢰에 영향을 미치기 때문에 이는 중요합니다. 이제 핵심 질문은 Canva가 너무 오랫동안 성장을 둔화시키지 않고 더 높은 비용을 감당할 수 있는지 여부입니다.</p>
