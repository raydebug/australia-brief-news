        <p>빅토리아 경찰이 2022년 엉터리 체포 과정에서 영구적인 뇌 손상을 입은 깁스랜드의 한 아버지가 제기한 민사 소송을 합의로 마무리했다. 보도에 따르면 합의금은 1,400만 호주달러에 가깝다. 이는 최근 경찰의 대형 합의 중 하나로 꼽힌다. 이 사건은 체포 방식과 경찰 책임을 다시 묻게 했다. 민사 분쟁은 끝났지만 당시 대응이 적절했는지에 대한 의문은 남아 있다.</p>
