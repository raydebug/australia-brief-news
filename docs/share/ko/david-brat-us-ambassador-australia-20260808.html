        <p>미 상원은 David Brat을 호주 주재 새 미국 대사로 승인했다. 이 자리가 몇 달 동안 비어 있었던 만큼 이번 인선은 의미가 크다. 워싱턴과 캔버라는 아직 관세, 국방 조율, AUKUS를 둘러싼 압박을 함께 다뤄야 하기 때문이다. Brat은 무역, 핵심 광물, 안보 협력에 집중하겠다고 밝혔고, 다음 단계는 그가 캔버라에 도착해 업무를 시작하는 시점이다.</p>
