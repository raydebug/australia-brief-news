        <h1>노동당, 다음 세제 분할안 전에 과부세 허점 메우기 나서</h1>
        <p>노동당이 비판을 받은 이른바 과부세 허점을 메우려 하고 있다. 사망이나 이혼 상황에서도 예정된 CGT와 네거티브 기어링 혜택이 제대로 적용되도록 손보는 작업이다. 공동 명의 투자 부동산은 관계가 끝나거나 배우자가 사망할 때 허점에 걸리기 쉬워 이 수정이 중요하다. 재무부는 초안에 대한 의견 수렴을 8월 21일까지 진행한다고 밝혔고, 관건은 옛 규칙이 누군가에게 피해를 주기 전에 고쳐지느냐는 점이다.</p>
