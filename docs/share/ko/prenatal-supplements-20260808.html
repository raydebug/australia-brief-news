        <h1>전문가들, 임신기 보충제 과장 광고에 경고</h1>
        <p>호주 임신 지침은 대부분의 임신부에게 엽산, 요오드, 철분을 핵심 보충제로 제시한다. 그런데 소셜미디어에서는 추가 제품이 퍼지고 있고, 전문가들은 그것이 효과가 없거나 피할 수 있는 해를 부를 수 있다고 경고한다. 이 이슈가 중요한 이유는 임신 관련 조언이 광고에 쉽게 흔들리고, 가족들이 근거보다 마케팅에 돈을 쓰게 되기 때문이다. 앞으로는 의사와 규제기관, 플랫폼이 이런 혼선을 얼마나 줄일지가 관건이다.</p>
