        <h1>衛生監管機構因群發電郵外洩醫生資料而致歉</h1>
        <p>澳洲衛生投訴監管機構因一封群發電郵外洩了100多名受邀參加成癮與酒精照護網路研討會的醫生、護士和其他從業者身分而道歉。這件事的重要性在於，郵件把姓名和敏感培訓主題直接連在一起，也讓外界重新關注醫療資料的處理方式。AHPRA表示，事件已通報給監察機構，並已向受影響人員致歉。接下來要看的是，監管機構會不會調整電郵安全措施，以及是否會引發更廣泛的隱私審查。</p>
