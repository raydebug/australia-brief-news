        <h1>燃料進口把澳洲貿易順差壓到多年低點</h1>
        <p>澳洲六月季度的貨物貿易順差降至約 11 億澳元，原因是燃料和電動車進口大幅增加。直接推手仍然是中東燃料衝擊，各方都在搶運額外貨源，這很重要，因為貿易平衡如今已把供應應對的代價清楚反映出來。接下來要看的是，燃料價格和進口量會不會在下一次澳洲統計局數據裡繼續拖累貿易表現。</p>
