        <p>雪梨機場當天有數十個航班延誤，Airservices Australia 表示，排班問題影響了空中交通管理，波及超過 150 個航班。這個消息重要，是因為一次人手或排班故障就可能連鎖影響報到、轉機和取消，牽動數千名旅客。現在最關鍵的是營運能否盡快恢復正常，以及這是否反映更廣泛的 staffing 問題。乘客仍需要在出發前向航空公司確認航班。</p>
