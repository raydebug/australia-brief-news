        <h1>工黨著手填補「寡婦稅」缺口，趕在下一輪稅改前修補</h1>
        <p>工黨正著手修補被批評者稱作「寡婦稅」的稅務安排，把原本承諾的資本利得稅和負扣稅豁免更完整地適用於死亡和離婚情形。這個問題重要，因為共同持有的投資物業在關係結束或配偶去世時，可能會被這道缺口波及。財政部表示，草案諮詢將持續到8月21日，所以真正的看點是補救措施能否在有脆弱持有人被舊規則影響之前到位。</p>
