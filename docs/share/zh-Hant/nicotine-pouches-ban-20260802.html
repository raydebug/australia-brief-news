        <p>澳洲已經收緊規則，尼古丁袋不再能透過舊的處方途徑進入市場或流通。監管機構說，這類產品正借由零售暗門和網路渠道擴散，年輕人也能很容易把它們藏在教室或室內空間裡。之所以重要，是因為尼古丁袋本來就嵌在更大的非法菸草市場裡，衛生部門多年都在設法壓制。現在的關鍵，是邊境攔截和零售執法能否跟上需求。</p>
