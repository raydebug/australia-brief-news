        <h1>以奧威爾為靈感的原住民作品拿下NATSIAA最高獎</h1>
        <p>瑞安·普雷斯利憑一件融合文藝復興繪畫與喬治·奧威爾意象的作品，拿下全國原住民與托雷斯海峽島民藝術獎的最高獎。10 萬澳元獎金讓原住民當代藝術再次成為全國焦點，也說明評審今年看重的是更大膽、更有層次的主題表達。它的重要性在於，重要獎項會影響哪些藝術家獲得更廣泛關注和市場機會。下一步是這件作品在展覽之外會受到怎樣的評價。</p>
