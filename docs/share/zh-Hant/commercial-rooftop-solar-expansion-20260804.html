        <h1>工黨擴大商業屋頂太陽能補貼，鎖定企業電費</h1>
        <p>聯邦政府正擴大太陽能折扣計畫，讓更大的商業屋頂系統也能享有補貼，不再只限於小型安裝。官員表示，中型企業大約可節省 6.8 萬澳元的安裝成本，較大的倉庫或工廠則可一次省下約 23.2 萬澳元，並把每年電費再減少約 17.5 萬澳元。這項措施重要之處在於，它把政策重點放到一直落後於家庭屋頂太陽能的商業場景，尤其是工廠、零售與物流場地。接下來要觀察的是審批速度與安裝能力能否跟上。</p>
