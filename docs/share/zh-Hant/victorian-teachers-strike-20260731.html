        <h1>維州教師因薪酬談判停滯準備再度罷工</h1>
        <p>維多利亞州公立學校教師在州工會表示最新薪酬方案仍然不夠後，將再次進行 24 小時罷工。這很重要，因為反覆停工會擾亂家庭安排，也說明在數月談判後，爭議依然沒有解決。如果雙方都不讓步，8 月 19 日的罷工就可能照常發生，並繼續向政府施壓，要求提高報價。</p>
