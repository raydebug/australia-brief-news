        <h1>奧貝德家族圍繞煤炭收益的稅務爭議可能持續拖延</h1>
        <p>新南威爾斯州前工黨實權人物 Eddie Obeid 的家人仍在和稅務局爭奪一筆 3,000 萬澳元的煤炭專案出售收益。包括他的妻子和兒子在內的 11 名家屬或配偶，正試圖把這場已經拖了多年的最終上訴再往後推。這個案件重要，因為它成了稅務局如何處理金額龐大、又帶有政治敏感度收益的一次長期檢驗。接下來要看，法院會不會讓上訴繼續推進，還是再給家屬更多時間。</p>
