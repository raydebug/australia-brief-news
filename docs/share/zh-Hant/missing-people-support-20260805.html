        <h1>長期失蹤案件讓家屬長期缺乏支援</h1>
        <p>十多年來，Cathy Wood 一直在尋找父親失蹤的答案，這起個案說明，長期失蹤案件往往會讓家屬得不到足夠的正式支援。Richard Wood 的船後來被發現停泊在 Moreton Bay，但人卻不見蹤影，警方在搜尋八天後叫停行動。更大的問題在於，成千上萬的澳洲人都在承受沒有結論的失落，而心理輔導和案件跟進的缺口可能持續很多年。接下來要看，各州和聯邦是否會為這種處境中的家庭提供更多支援。</p>
