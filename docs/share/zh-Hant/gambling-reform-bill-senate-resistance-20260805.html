        <h1>工黨賭博改革方案在參議院遇阻</h1>
        <p>聯邦賭博改革方案在參議院遭遇阻力，聯盟黨、綠黨和幾位獨立議員都在推動更嚴格的廣告與誘因限制。爭議也和調查聽證連在一起，聽證中有人指控博彩公司曾向高價值客戶提供毒品和性工作者，而相關公司都予以否認。這件事之所以重要，是因為工黨想在收緊賭博規則的同時守住整套法案。接下來要看，部長們是否會進一步修改方案，爭取在8月17日調查報告前拿到足夠支持。</p>
