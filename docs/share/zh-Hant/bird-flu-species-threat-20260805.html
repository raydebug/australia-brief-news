        <h1>禽流感已變成全國性的野生動物威脅</h1>
        <p>澳洲的禽流感問題正在從零散檢出走向更廣泛的野生動物風險，最新警告稱企鵝、海豚和數百種本土物種都可能受影響。這個問題重要，是因為一旦病毒進入繁殖地或遷徙通道，損失會來得很快，也很難控制。最新報導一方面提到本地棲息地的風險，另一方面也有聯邦評估把近400種物種列入危險範圍。接下來要看監測和生物安全措施，能不能在更多棲息地受影響前把擴散速度壓下來。</p>
