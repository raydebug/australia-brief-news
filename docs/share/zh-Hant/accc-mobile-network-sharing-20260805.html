        <p>澳洲競爭與消費者委員會已經啟動調查，研究當某家業者沒有訊號時，手機用戶是否應自動切換到其他網路。審查範圍包括國內漫遊與基站共享，重點放在偏遠和鄉村地區。這個議題重要，因為 Telstra 和 Optus 最近的故障暴露出單一網路失靈時覆蓋有多脆弱。接下來要看，監管機構能否提升可靠性，同時不削弱新基站投資。</p>
