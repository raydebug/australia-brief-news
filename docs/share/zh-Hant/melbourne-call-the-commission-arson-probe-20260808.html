        <h1>墨爾本警方在「委員會」相關縱火案中起訴一名少年</h1>
        <p>墨爾本警方已起訴一名17歲少年，調查範圍則圍繞店家在縱火前收到寫著「聯絡委員會」的紙條持續擴大。調查人員說，他們已把19張紙條、手機和SIM卡聯繫起來，並懷疑有些年輕人被境外犯罪網絡吸進去。這個案子重要，因為它指向的是更大的勒索體系，而不只是單獨幾起火警。接下來要看兒童法庭程序，以及更高層組織者是否會被進一步追查。</p>
