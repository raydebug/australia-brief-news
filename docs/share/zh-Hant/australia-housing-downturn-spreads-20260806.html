        <h1>澳洲房價回調從雪梨和墨爾本擴散到更多地區</h1>
        <p>最新住房數據顯示，澳洲更多地區的房價正在回落，7月全國房價下跌，弱勢已不再只局限於雪梨和墨爾本。分析人士認為，較高利率、影響投資者的稅制變化和市場情緒轉弱是主要原因。它之所以重要，是因為住房處在生活成本壓力、借貸和選舉政治的中心。現在的問題是，這輪下跌會停留在溫和調整，還是會進一步擴大。</p>
