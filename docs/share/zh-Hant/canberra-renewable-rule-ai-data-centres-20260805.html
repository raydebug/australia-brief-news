        <h1>坎培拉準備為人工智慧資料中心設定可再生能源規則</h1>
        <p>聯邦政府正準備出台全國性規則，要求新的人工智慧資料中心以可再生能源而不是天然氣供電。這個方向之所以重要，是因為伺服器機房的擴張已經碰到電網容量、州規劃審批和電價政治的限制。Chris Bowen說，即便昆州和北領地反對，坎培拉也應該能設定全國底線。接下來要看，這套立法能否通過，同時又不拖慢投資或削弱供電可靠性。</p>
