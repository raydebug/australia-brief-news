        <h1>Qantas 舊外包案剩餘的 3800 萬澳元賠償終於要發放</h1>
        <p>聯邦法院法官已下令，把 Qantas 2020 年外包案件中剩餘的賠償款發給受影響的地勤員工。相關款項此前一直留在法院，李法官說拖延時間已經過長。此案之所以重要，是因為它仍是澳洲規模最大的勞動法裁決之一，也顯示出賠償流程在原始裁決後仍可能拖很久。接下來是盡快發放資金，同時後續結算程序繼續推進。</p>
