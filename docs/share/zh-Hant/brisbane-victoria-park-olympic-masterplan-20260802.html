        <h1>布里斯本維多利亞公園奧運方案面臨資金和設計審視</h1>
        <p>昆士蘭公布了 2032 年奧運和殘奧會的維多利亞公園總體方案，包括一座可容納 6.3 萬人的體育場、通往市中心的新連接，以及更多公共空間。這個方案之所以重要，是因為它把數十億資金投向布里斯本最大的內城項目之一，並將長期影響交通和公園用地。現在仍未解決的問題包括整個區域的最終成本、資金如何分攤，以及如何處理歷史和文化方面的反對意見。隨著方案從概念走向落實，爭論預計還會繼續。</p>
