        <h1>高院允許秘密錄音作為家暴案證據</h1>
        <p>澳洲高等法院維持了一段秘密錄音在強姦案中的證據效力，錄音內容是妻子用手機記下丈夫承認施暴的對話。法院認為，這份錄音保護了她的身體自主和完整性，因為她擔心自己還會再次遭到強姦。這項裁決重要在於，它為受害人和倖存者私下保存施暴證據提供了更穩固的法律途徑。接下來要看，這套理由會在其他家暴案件和保護令程序中延伸到多遠。</p>
