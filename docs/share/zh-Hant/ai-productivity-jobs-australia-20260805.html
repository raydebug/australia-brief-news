        <h1>EY 認為人工智能可提振生產率並為澳洲增加就業</h1>
        <p>EY 的最新模型顯示，人工智能在未來十年內可能把澳洲生產率最多提高 2.4%，並帶來大約 44,000 個額外職位。如果企業能盡快採用技術並重新培訓員工，國內生產總值也可能明顯增加。之所以重要，是因為澳洲已經被長期的生產率低迷拖住，而這場討論現在已延伸到生活水平、能源使用和資料中心規則。真正要看的是政策能否跟上，以及收益會不會只落在大型企業身上。</p>
