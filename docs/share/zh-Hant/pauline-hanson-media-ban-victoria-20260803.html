        <h1>漢森禁止多家媒體進入記者會引發新聞自由爭議</h1>
        <p>漢森把澳洲廣播公司、《衛報》和《時代報》擋在維州一場記者會外面，之後又把這次做法說成是對記者的一次臨時提醒。爭議發生時，一國黨正在推出候選人並試圖在州內擴張影響力。它的重要性在於，這觸及政治人物是否可以選擇性開放採訪，以及媒體監督能否保持同等通道。漢森後來表示禁令不會一直持續，但她並沒有收回這場批評。</p>
