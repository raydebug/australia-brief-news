        <h1>研究人員在愛麗絲泉附近發現罕見袋狼股骨</h1>
        <p>北領地 Alcoota 化石點的研究人員發現了一塊完整的袋狼股骨。這塊骨頭約有 800 萬年歷史，也是該地點首次找到的同類完整標本。它的重要性在於，肢骨化石能幫助科學家更好理解這種動物如何移動，以及它在澳洲遠古生態系統中的位置。接下來還要看化石層裡是否會出現更多線索。</p>
