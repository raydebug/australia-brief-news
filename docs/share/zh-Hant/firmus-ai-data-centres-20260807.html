        <h1>資料中心公司獲29億澳元融資，加快人工智慧資料中心擴張</h1>
        <p>這家資料中心公司表示，29億澳元融資將讓它更快推進在澳大利亞和亞太地區建設人工智慧資料中心的計畫。公司認為，這筆資金讓擴張所面臨的主要瓶頸大為緩解。此事重要，因為這類專案需要龐大資本與電力，也正成為澳洲科技基礎設施競賽的一部分。下一步要看資金能多快轉化為實際產能。</p>
