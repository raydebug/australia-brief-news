        <h1>布里斯本無家可歸兒童人數升至1500人以上</h1>
        <p>Brisbane Zero 的最新統計顯示，在上一財年，布里斯本共有 984 個家庭、1,539 名兒童被識別為無家可歸者。大多數家庭由單親母親帶領，這說明住房壓力如何迅速演變成家庭流離失所。這個數字之所以重要，是因為它把城市住房危機變成了可衡量、可定位的現實，也顯示臨時住宿、學校和支援服務正在承壓。接下來要看政府和社會服務機構是否能把這份統計轉化為更穩定的住房路徑。</p>
