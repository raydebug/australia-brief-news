        <h1>年長的澳洲人仍然面臨縮小住房的障礙</h1>
        <p>許多55歲以上的澳洲人表示，他們願意搬進較小的房屋，但實際的障礙不斷減緩這種轉變。最大的障礙是情感依附、稀缺的合適庫存以及搬家的成本和文書工作。這很重要，因為推出更多適合縮小規模的住房可以緩解緊張的房地產市場的壓力。下一步是規劃和稅收設置是否使較小的房屋更容易找到和搬進。</p>
