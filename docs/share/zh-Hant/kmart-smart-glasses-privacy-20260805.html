        <h1>Kmart 的廉價攝影眼鏡重新點燃隱私爭議</h1>
        <p>Kmart 89 澳元的攝影眼鏡很快就售罄，也讓低價可錄影穿戴裝置在澳洲再次成為隱私焦點。這些眼鏡可以拍照和錄影片，還能打電話並執行 AI 助理，因此隱私倡議者認為它們會讓公共場所的同意問題更難處理。之所以重要，是因為這類產品價格夠低，擴散速度可能很快，而法律和場地規則還跟不上技術。接下來要看監管機構、零售商或公共場所會不會在這些裝置變普及前設下更清楚的限制。</p>
