        <h1>澳洲房市下行擴大，近期買家壓力更明顯</h1>
        <p>7月房價再度下跌，而且跌勢已不再只侷限於雪梨和墨爾本。AAP稱，大約34,000名使用5%首購押金計畫的買家，在市場持續走弱時可能面臨負資產；Cotality的數據則顯示，全國房價當月仍下跌0.7%。這表示房價走軟一方面有利於新買家，另一方面也會加重近期買房者的壓力，並可能影響放貸信心。接下來要看降息、掛牌量增加或政策變化，能否讓市場穩定下來。</p>
