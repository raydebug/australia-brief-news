        <p>Lidia Thorpe 支持設立一個專門調查原住民與托雷斯海峽島民遭遇種族主義問題的皇家委員會。隨著國會調查持續聽取關於政治、媒體和公共生活中種族主義的證詞，這項呼籲也在升溫。這件事重要，是因為它可能把討論從聽證證詞推進到一個權限更強、範圍更廣的正式調查。下一步要看坎培拉會不會擴大調查範圍，還是繼續沿用現有審查程序。</p>
