        <h1>捷星航空把頭頂行李變成付費選項</h1>
        <p>捷星航空將從 2027 年 2 月起調整客艙行李規則，免費部分只保留一件小型座椅下行李，而放入頭頂行李艙的大件行李需要購買 Priority Carry-on。報導提到，短航線價格大約從 25 澳元起，較長航線可能超過 50 澳元，原來的 7 公斤總重量限制也會取消。這項變化重要，是因為它重新定義了澳洲廉航最常見的服務組合，也會改變旅客的打包方式和登機成本。接下來要觀察的是旅客是否接受這項新收費，以及其他航空公司會不會跟進。</p>
