        <h1>Meta 正向一些與煽動性內容相關的澳洲創作者付費</h1>
        <p>ABC 的調查指出，Meta 正直接向幾名頗具爭議的澳洲內容創作者付費，其中包括與白人民族主義和反疫苗內容有關的人物。這個問題的重要性在於，它顯示一家大型平台可能正在把接近自身有害互動規則的內容變成收入來源。現在的核心問題是，這些付款只是個別現象，還是社群媒體把憤怒情緒變現的更大問題的一部分。隨著平台在審核和變現標準上承受壓力，外界的追問還會繼續。</p>
