        <h1>NAPLAN 成績顯示全國讀寫和算術都在下滑</h1>
        <p>澳洲最新一輪 NAPLAN 結果顯示，閱讀、寫作和數學都承受壓力，仍有相當比例學生沒有達到基準線。AAP 把焦點放在閱讀和寫作整體走弱，《時代報》則強調約三分之一學生未達基準。這個結果重要，因為它會直接影響學校支援、政策討論，以及孩子在升上中學前能否補上基礎差距。接下來要看的是，各州能否把數據盡快轉化成有針對性的幫助。</p>
