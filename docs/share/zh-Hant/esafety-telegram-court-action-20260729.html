        <h1>澳洲eSafety監管機構起訴Telegram</h1>
        <p>澳洲eSafety監管機構已經啟動訴訟，可能讓Telegram面臨最高5460萬澳元罰款，理由是其被指未能及時清除支持恐怖主義的內容。監管方稱，相關材料包括暴力宣傳和極端主義內容，儘管用戶已經舉報，仍然可以存取。這宗案件的重要性在於，它會檢驗澳洲線上安全法律如何適用於擁有大量本地用戶的全球通訊平台。接下來由法院判斷Telegram是否違反義務，以及後續會如何處理。</p>
