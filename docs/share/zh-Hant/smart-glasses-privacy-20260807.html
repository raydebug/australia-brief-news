        <h1>低價智慧眼鏡引發澳洲新的隱私審查</h1>
        <p>澳洲隱私監管機構正被要求審視內建攝影鏡頭的低價智慧眼鏡擴散所帶來的風險。官員承認這類設備有用途，但也會讓暗中拍攝和騷擾更容易，尤其是在公共場所。之所以重要，是因為這類產品越來越便宜，而隱私規則還沒完全跟上。監管層現在必須判斷現行法律是否足夠，還是需要新的限制。</p>
