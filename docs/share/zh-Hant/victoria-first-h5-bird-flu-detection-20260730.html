        <h1>維州確認首例H5禽流感檢出</h1>
        <p>維多利亞州在西南部波特蘭附近的一隻大鳳頭燕鷗檢測呈陽性後，確認了本州首例H5禽流感。這個發現疊加在南澳和其他州已經擴大的野生動物疫情之上，隨著檢測繼續，更多病例並不意外。之所以重要，是因為一旦病毒在野生鳥群中持續傳播，損失會擴散得很快，即使家禽業目前還沒有受創。官方表示，後續還會繼續監測，完整情況仍可能變化。</p>
