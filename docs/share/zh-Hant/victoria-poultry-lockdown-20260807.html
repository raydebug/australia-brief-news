        <h1>維州要求家禽留在棚內，以阻止禽流感擴散</h1>
        <p>維多利亞州已要求擁有 50 隻以上家禽的飼主把鳥類留在室內，至少持續 14 天，以因應 H5 禽流感持續上升的檢測結果。新規涵蓋墨爾本都會區、沿海地帶與部分周邊區域，官方希望先把病毒擋在商業養殖場外。這件事關係到雞蛋供應、放養標示和家禽產業，因為一旦病毒進入農場，影響會迅速擴大。接下來要看這項預防措施能否壓住風險，還是還會出現更嚴格的限制。</p>
