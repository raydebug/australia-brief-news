        <h1>西澳三年級NAPLAN成績持續為早期數學敲警鐘</h1>
        <p>西澳最新NAPLAN結果再次把三年級數學推到焦點上，約四成學生仍未達到預期標準。之所以重要，是因為小學低年級的缺口如果不盡快補上，後面往往會越拉越大。九年級表現相對更強，說明問題主要集中在早期階段，而不是整個系統全面失靈。眼下的關鍵是學校和州政府能否把這份結果轉化為有針對性的支援。</p>
