        <h1>靠 JobSeeker 生活仍是澳洲生活成本壓力測試</h1>
        <p>澳洲領取 JobSeeker 的人仍然要靠每天約 68 澳元過活，而聯邦預算裡基本補助並沒有上調。報導指出，房租、食物和交通是最主要的壓力來源，倡議者認為這筆補助已經無法覆蓋基本生活開支。這之所以重要，是因為討論焦點已經從通膨擴展到貧窮，以及僅靠指數化調整是否還能跟上現實。下一步要看政府是否重新審視補助水平，還是繼續維持原狀。</p>
