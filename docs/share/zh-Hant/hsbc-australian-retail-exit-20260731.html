        <h1>滙豐開始退出澳洲零售銀行業務</h1>
        <p>滙豐將在18個月內逐步收縮澳洲零售銀行業務，並把價值360億澳元的住房和個人貸款組合賣給黑石。約19家分行會關閉，但公司會保留企業、機構、資管和私人銀行業務。這個變化意味著，澳洲客戶可面對面辦理銀行業務的選擇會進一步減少，員工安排也會進入調整期。交易還要經過監管批准，接下來要看的，是貸款服務、帳戶遷移和崗位變動會怎樣落地。</p>
