        <h1>SA 灰狗訓練師因嚴重違反福利規定而被禁止</h1>
        <p>Greyhound Racing SA 在發現屢次違反動物福利規定後，取消了 Riverland 訓練師 Vernon Anderson 的參賽資格八年多。該小組表示，他未能為一隻身體不適的狗提供獸醫護理，沒有為其他狗提供足夠的水，並將灰狗關在不合適的拖車裡。這項決定很重要，因為它使福利標準重新成為人們關注的焦點，並表明監管機構正在嚴肅對待違規行為。下一步是該裁決是否會促使整個行業對飼養和訓練條件進行更廣泛的審查。</p>
