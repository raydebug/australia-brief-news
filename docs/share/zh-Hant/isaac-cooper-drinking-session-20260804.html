        <h1>艾薩克．庫柏因格拉斯哥飲酒事件退出隊內領導層</h1>
        <p>澳洲游泳選手艾薩克．庫柏因在格拉斯哥英聯邦運動會期間被指沒有留在場邊支持隊友、而是外出飲酒，已退出「海豚隊」的領導小組。澳洲游泳協會表示，他缺席了比賽最後一晚和隊內會議，這與團隊要求不符。這件事之所以重要，是因為庫柏是澳洲較知名的游泳選手之一，隊伍原本也依賴他參加接力和仰泳項目。他仍計畫於8月12日在美國出戰泛太平洋游泳錦標賽，接下來要看這次處分會不會影響他在國家隊的長期位置。</p>
