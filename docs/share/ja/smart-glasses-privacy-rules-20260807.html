        <h1>オーストラリア、スマートグラスのプライバシー監督を強化へ</h1>
        <p>連邦政府の法務当局は、スマートグラスによる見えにくい録画や監視への懸念を受け、プライバシー委員に調査を求めました。規制当局は、本人が気づかないまま撮影される可能性があるとし、特に女性や子ども、脆弱な立場の人への影響を警戒しています。いま問われているのは、装着型カメラや顔認識機能が広がる前に、現行の法律で十分対応できるかどうかです。次の焦点は、既存ルールで足りるのか、それとも急いで見直す必要があるのかです。</p>
