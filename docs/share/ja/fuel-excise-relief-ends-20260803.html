        <h1>燃料減税の終了で、豪州のガソリン高が再び進む</h1>
        <p>8月3日深夜に一時的な燃料税の減免が終わり、卸売段階のコストは1リットル当たり16豪セント上がりました。小売価格への反映は数日から1週間ほどかけて進む見通しで、家計や物流費、物価にじわり効いてきます。補助がなくなったことで、各社が既存在庫をどう値付けするかが注目点です。今後は各都市での上昇ペースと、競争当局が便乗値上げを見つけられるかが焦点になります。</p>
