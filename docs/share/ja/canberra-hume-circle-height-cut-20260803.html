        <h1>キャンベラの計画担当者、反発を受けてヒュームサークルの高さ制限を削減</h1>
        <p>ACT計画担当者は、地域社会の強い反発を受けて、キャンベラ南部のヒュームサークル地区に提案されていた建物の最大高さを削減した。この変化が重要なのは、主要な交通ジャンクション周辺の地域がどの程度密集するかが決まり、その後の首都での住宅決定の方向性が決まるからである。計画はまだ協議と最終承認を経て進められているため、建設が着工する前に再び設計が変更される可能性がある。</p>
