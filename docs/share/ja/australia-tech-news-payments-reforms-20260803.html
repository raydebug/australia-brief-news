        <h1>キャンベラ、ニュース対価を求める巨大ITへの規制を強化</h1>
        <p>キャンベラは、ニュース利用の対価を求める巨大IT向けの制度を強化した。十分な地元出版社と契約しない企業には、オーストラリアのデジタル広告収入に対して2.5％の負担がかかる。リンクトインも対象に加わり、制度の狙いはオーストラリアの報道機関との商業交渉を促すことだ。報道収入の行方と巨大プラットフォームの交渉力に関わるため重要で、今後は議会で法案がまとまるかが焦点になる。</p>
