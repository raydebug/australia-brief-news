        <h1>NSW警察、職務執行時のボディカメラ使用を義務化</h1>
        <p>ニューサウスウェールズ州警察の数千人の警察官は、職務として警察権限を行使する際、ボディウォーンカメラを必ず起動しなければならなくなった。これは、Four Cornersの調査と、カメラが使われていなかったり、遅れて起動された事例をめぐる監督機関の長年の圧力を受けたものだ。逮捕、追跡、路上での実力行使の証拠の残り方が変わるため重要で、録画しなかった場合は理由を文書で説明する必要がある。今後は、運用がどれだけ一貫して守られるかが試される。</p>
