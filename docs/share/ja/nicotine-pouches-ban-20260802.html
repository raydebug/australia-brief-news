        <h1>豪州、ニコチンパウチの抜け穴を封じる</h1>
        <p>オーストラリアは規制を強め、ニコチンパウチが旧来の処方ルートで流通する余地をなくしました。規制当局は、こうした製品が店頭の抜け道やオンライン経由で広がり、若者が教室や屋内で簡単に隠せる点を問題視しています。重要なのは、ニコチンパウチが長年取り締まり対象だった違法たばこ市場の一部になっていたことです。今後は、税関での差し止めと小売り段階の摘発が需要に追いつけるかが焦点です。</p>
