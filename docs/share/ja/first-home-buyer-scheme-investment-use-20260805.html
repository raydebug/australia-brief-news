        <h1>初回住宅購入保証制度が投資用転用を巡り注目を集める</h1>
        <p>ガーディアンの分析によると、オーストラリアの5％頭金の初回住宅購入保証制度で買われた住宅のうち、約1,500件が後に投資用物件へ転用された。所得上限が外れたあと購入件数は急増し、月間の利用は5,600件を超えたという。制度は本来、自分で住むための購入者を支援するためのもので、投資家の抜け道になるためのものではない。次に注目されるのは、キャンベラが審査を厳しくするのか、現状維持にするのかだ。</p>
