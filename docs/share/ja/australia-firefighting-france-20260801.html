        <h1>オーストラリアが消防隊と航空機を派遣し、フランスの大規模山火事対応を支援</h1>
        <p>オーストラリアは、チヌークヘリコプター、支援機、消防要員をフランスへ送り、ヨーロッパで広がる山火事対応を後押ししている。フランスとスペインでは、暑く乾燥した気象のあとに火勢が速く広がっており、今回の支援で空中輸送力と夜間消火能力が補強される。これは、オーストラリアが長年培った消火能力を海外の緊急事態に投入している点で重要だ。派遣の開始時期や期間は、現地の火勢次第で変わる。</p>
