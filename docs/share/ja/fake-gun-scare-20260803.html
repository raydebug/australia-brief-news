        <h1>シドニーのムーアパークでのレプリカ銃恐怖、2人の逮捕で終わる</h1>
        <p>NSWシドニーのエンターテインメント・クォーターで銃器の通報で警官が出動し、大規模な対応があった後、警察は男2人を逮捕した。警察によると、物体は銃のレプリカで、ベストとバッジも押収された。この恐怖により、SCG近くの混雑した分署の一部が閉鎖され、武器の通報があった場合に警察がいかに迅速に行動するかを示したので、これは重要である。捜査は続いており、警察は現在進行中の脅迫はないとしている。</p>
