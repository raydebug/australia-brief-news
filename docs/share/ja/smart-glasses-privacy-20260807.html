        <h1>オーストラリア、カメラ付き低価格スマートグラスの普及で個人情報ルールを見直し</h1>
        <p>カメラを内蔵した低価格のスマートグラスが、オーストラリアの個人情報保護ルールに再び圧力をかけています。法務長官は、Kmart の89豪ドル製品が売り切れ、こっそり撮影への懸念が広がったことを受け、個人情報保護委員に調査を求めました。重要なのは、法の明確な歯止めが整う前に機器だけが安く普及していることです。今後は、キャンベラが制度改正として扱うのか、それとも州・準州法に主に委ねるのかが焦点になります。</p>
