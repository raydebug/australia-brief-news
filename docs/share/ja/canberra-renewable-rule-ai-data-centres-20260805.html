        <h1>キャンベラが人工知能データセンター向けの再エネ基準を準備</h1>
        <p>連邦政府は、新しい人工知能データセンターに再生可能エネルギーでの稼働を求める全国ルールを準備している。サーバー施設の急増が送電網の余力、州の開発規制、電気料金をめぐる政治とぶつかっているため、この方針は重要だ。Chris Bowen氏は、クイーンズランド州やノーザンテリトリーが反対しても、キャンベラが全国基準を示すべきだと主張している。焦点は、投資を鈍らせず、供給の信頼性を損なわずに法案を通せるかどうかだ。</p>
