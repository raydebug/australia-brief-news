        <h1>ノースシドニー・オリンピック・プールが1億2200万豪ドルの改修を経て再開</h1>
        <p>ノースシドニー・オリンピック・プールが、5年と1億2200万豪ドルを投じた改修のあと再開しました。1936年開業の施設は更新され、改修済みのプールや休養設備が整い、最初の3日は一般に無料開放されます。重要なのは、公共施設である一方、長く費用面が問題視されてきた事業だったことです。今後の焦点は、完成した施設がそのコストに見合うかどうかです。</p>
