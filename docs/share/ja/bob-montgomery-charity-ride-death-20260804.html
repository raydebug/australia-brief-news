        <h1>Bob Montgomeryさん、全豪縦断のMND支援ライド完走後に死去</h1>
        <p>Bob Montgomeryさんは、運動ニューロン疾患への認知と寄付を呼びかけるためにオーストラリアを横断する5300キロのライドを終えた翌日に亡くなりました。この話が重要なのは、家族の支援活動を全国的な話題に変え、MNDとともに生きる人に必要な支援サービスへ再び注目を集めたからです。今後の焦点は、集まった資金の使い道と、家族や支援者がこの走行と彼自身をどう記憶するかです。</p>
