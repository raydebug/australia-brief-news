        <h1>シドニーの AI データセンター計画に緑地を巡る反発</h1>
        <p>Sydney の Arncliffe にある旧 Kogarah Golf Club 跡地の再開発案が、AI data centre を用途候補に含むとして地元の強い反発を招いています。計画には物流、商業施設、ホテル、駐車場、Cooks River 沿いの公共緑地も含まれます。焦点は、Sydney がデジタル基盤を拡大しながら、限られた都市緑地、地域環境、電力網の余力を守れるかです。次は NSW の計画審査と、事業者が住民意見にどう答えるかです。</p>
