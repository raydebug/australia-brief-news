        <h1>キャンベラ、人工知能データセンターの規制を強化</h1>
        <p>連邦政府は、新しい人工知能データセンターの電力使用に、より厳しい条件を課そうとしています。計画では、事業者に対して送電網へ十分な電力を戻すことの証明を求め、ガスだけに頼る案件は認めない方針です。重要なのは、データセンターの拡大が電力容量、州・準州の許認可、土地利用の圧力とぶつかっているからです。今後は、投資を逃がさずにこの枠組みを実行できるかが焦点になります。</p>
