        <h1>オーストラリアが今後10年の防衛技術の重点を示す</h1>
        <p>オーストラリアは、長射程攻撃、高出力レーザー、自律システム、量子技術、人工知能、海中戦の6分野を柱にした10年の防衛イノベーション計画をまとめた。重要なのは、研究を実際に配備できる能力へ素早くつなげようとしている点で、最近の紛争は、安価で変化の速い技術が戦力差を一気に動かし得ることを示した。今後の焦点は、防衛当局と産業界がこの速度に追いつき、装備を予定どおり形にできるかどうかだ。</p>
