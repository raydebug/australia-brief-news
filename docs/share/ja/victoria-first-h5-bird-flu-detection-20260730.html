        <h1>ビクトリア州で初のH5鳥インフル確認</h1>
        <p>ビクトリア州は、西南部ポートランド近くで大きなアジサシが陽性となり、州内初のH5鳥インフルを確認しました。これは南オーストラリア州などで広がっている野生動物の流行に加わるもので、検査が続く中でさらに見つかる可能性があります。重要なのは、ウイルスが野鳥の群れの中に広がり始めると、家禽への被害がなくても損失が急速に拡大し得ることです。当局は監視を強め続ける方針で、全体像はまだ変わる可能性があります。</p>
