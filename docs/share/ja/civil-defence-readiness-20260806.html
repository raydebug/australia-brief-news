        <h1>豪州、戦時の民間防衛体制を再点検</h1>
        <p>新しい連邦調査は、もし紛争で国内の供給や燃料、行政サービス、企業活動が乱れた場合に、オーストラリアがどう維持するのかを検証します。軍だけでなく、行政機関と民間部門が危機でどう連携するかも見ます。重要なのは、こうした全国規模の準備点検が第二次世界大戦以来ほとんど行われてこなかったからです。今後は、供給網や調整体制の弱点を示す証拠が集まるかが焦点です。</p>
