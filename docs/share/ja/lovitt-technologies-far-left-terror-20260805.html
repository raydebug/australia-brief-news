        <p>警察とASIOは、メルボルンのLovitt Technologiesに対する2025年7月の放火を、左派過激派による可能性のあるテロ行為として扱っています。こうした反兵器の破壊行為を、豪州当局が初めてテロの枠組みで捜査する点が重要です。捜査当局は動機がイスラエルとガザの衝突に結びついている可能性があるとみて、関与者の特定を進めています。今後は、テロ罪に足る証拠が固まるかが焦点です。</p>
