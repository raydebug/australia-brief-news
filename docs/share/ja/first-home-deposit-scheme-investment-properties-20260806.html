        <h1>初めての住宅向け頭金制度の購入が投資用物件に回る例が増えています</h1>
        <p>オーストラリアの5％頭金による初回住宅購入制度で買われた住宅のうち、約1,500件がその後に投資用物件へ転じていたことが新しいデータで分かりました。この数字が重要なのは、本来は居住用の購入者を支えるための制度なのに、住宅価格や制度条件の変化の中で、高所得層にも使われているからです。特に目立つ例として、年収67万4,000豪ドルの夫婦が利用していたことが分かっており、今後は政府が制度を引き締めるかが焦点です。</p>
