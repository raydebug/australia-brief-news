        <h1>カサリンの住民、若者犯罪の急増を受け対応を要求</h1>
        <p>ノーザンテリトリーのカサリンでは、若者による窃盗や危険な無断運転が相次いだことを受け、住民がより強い対応を求めています。最新の騒動では、母親と幼い子どもが危険な目に遭いかけ、外出制限や取り締まり強化を求める声がさらに高まりました。重要なのは、再犯を抑えつつ問題を別の場所に押し出さない対応を町が望んでいることです。次の焦点は、NT政府や警察が具体的な措置を取るかどうかです。</p>
