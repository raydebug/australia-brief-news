        <h1>南オーストラリア州の病院の廊下でのケアが問い合わせ電話を促す</h1>
        <p>南オーストラリア州の医師と看護師らは、患者は依然として病院の廊下で治療を受けており、システム内の圧力が緩和されていないことを示唆していると警告している。廊下でのケアは治療を遅らせ、スタッフに負担をかけ、適切なベッドで待っている人々の安全上のリスクを高める可能性があるため、この問題は重要です。次のステップは、州または病院の管理者が正式な見直しを命令し、冬の圧力がさらに高まる前にスペースを空ける動きをするかどうかだ。</p>
