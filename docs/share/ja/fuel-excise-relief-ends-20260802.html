        <h1>燃料税の軽減終了で、豪州のガソリン価格は上昇へ</h1>
        <p>豪州の一時的な燃料税軽減措置が終わり、ガソリンとディーゼルの価格はこれから段階的に上がる見通しです。小売価格への反映は一斉ではなく、店頭にはまだ古い在庫が残っているため時間差が出る可能性があります。ただ、卸売段階の税負担はすでに通常水準に戻っています。この変化は家計の通勤費だけでなく、物流や輸送コストにも直結します。今後の焦点は、値上がりの速さと、当局が不当な便乗値上げを抑えられるかです。</p>
