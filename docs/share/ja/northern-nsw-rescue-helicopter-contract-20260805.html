        <h1>NSW北部の救助ヘリ契約が再び精査対象に</h1>
        <p>議会調査によって、NSW北部の救助ヘリサービスが再び強い圧力を受けている。報告書では、いじめや虐待、運営体制の問題が重大だと指摘された。委員会は、安全上の懸念が解消されるまでNSW Ambulanceが契約を延長すべきではないと勧告している。広い地域の緊急医療ネットワークの一部であるため、影響が出れば搬送や救助の時間に響く。州政府はこの勧告に3か月以内に回答することになる。</p>
