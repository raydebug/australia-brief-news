        <h1>危険な電動自転車の輸入規制を連邦政府が強化</h1>
        <p>政府は、オーストラリアで販売される e-bike、e-scooter、e-skateboard に対する全国安全基準の策定を ACCC に求めます。案では出力と速度を抑え、けがや死亡につながっている高出力機器の流通を止めることを目指します。これが重要なのは、こうした機器がすでに道路や歩道に広がっており、州ごとの規則だけでは不十分だったからです。次は、基準をどれだけ早く作り、各州と準州で実施できるかです。</p>
