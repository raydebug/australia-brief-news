        <h1>シドニーの開発業者による手頃な住宅の約束が問われている</h1>
        <p>報道によると、開発会社はシドニーの開発計画で結んだ手頃な住宅の約束を2年早く終わらせようとし、計画法の変更が当初の合意を上回るべきだと主張しました。州の規制当局はすでに、住民への対応で開発業者のコミュニティ住宅部門に公平性と透明性の欠如を指摘しています。より大きな論点は、事業が進行した後でも手頃な住宅の約束がどれほど効力を持つのかです。今後はすぐの解決よりも、規制と法的な精査が強まる見込みです。</p>
