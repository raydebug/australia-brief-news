        <h1>メルボルン警察、「コミッション」関連の放火捜査で少年を起訴</h1>
        <p>メルボルン警察は、店主に「コミッションへ連絡しろ」と書かれた紙が残された一連の放火事件をめぐり、17歳の少年を起訴しました。捜査当局は19通のメモ、携帯電話、SIMカードを押収し、若者が海外の犯罪組織に取り込まれた可能性を見ています。これは単発の放火ではなく、脅しと恐喝が結びついた広い仕組みを示す点が重要です。今後は少年法廷の手続きと、背後にいる上位組織の特定が焦点です。</p>
