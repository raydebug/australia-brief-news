        <p>ニューサウスウェールズ州は、在来の野鳥でH5鳥インフルエンザを確認した。ウイルスが州内の野生動物に入り込んだことを示している。今いちばん気になるのは、湿地や沿岸、内陸の水系を通じてどこまで広がるかだ。次の段階は監視と防疫を強め、孤立した検出なのか、それとも拡大の始まりなのかを見極めることになる。</p>
