        <h1>ビクトリア州、鳥インフル拡大で家禽の屋内飼育を命令</h1>
        <p>H5鳥インフルエンザの検出が増えているため、ビクトリア州は鳥を50羽以上飼う生産者に対し、少なくとも14日間は屋内で管理するよう命じました。対象はメルボルン都市圏、沿岸部、周辺の一部地域です。ウイルスが商業農場に入り込めば、卵の供給や平飼い表示、養鶏事業に広く影響するため、この措置は重要です。今後は予防策で十分か、それとも追加規制が必要になるかが焦点です。</p>
