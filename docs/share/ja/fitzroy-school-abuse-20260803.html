        <h1>フィッツロイ・コミュニティ・スクールが新たな虐待疑惑に直面している</h1>
        <p>メルボルンの代替学校は、男子生徒が女子生徒をランク付けし、内容をオンラインで共有したという申し立てを受けて、新たな精査を受けている一方、別の虐待の主張は数十年前に遡る。家族や元生徒らが責任を追及する中、学校は捜査官を派遣した。コミュニティが運営する学校には依然として強力な保護システムと苦情システムが必要であるため、これは重要です。次のステップは捜査と、規制当局や警察からのフォローアップだ。</p>
