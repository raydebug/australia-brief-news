        <h1>企業向け屋上太陽光の支援を拡大</h1>
        <p>連邦政府は、対象を小規模設置だけでなく、より大きな商業用屋上太陽光にも広げる方針です。中規模企業なら設置費を約6万8,000豪ドル、さらに大きな倉庫や工場なら初期費用を約23万2,000豪ドル抑えられ、年間の電気代もおよそ17万5,000豪ドル減らせるとされています。家庭用の屋上太陽光に比べて遅れてきた商業部門を押し上げる狙いで、工場、小売店、物流施設にとっては投資の後押しになります。今後の焦点は、認可の速さと設置体制が需要に追いつくかです。</p>
