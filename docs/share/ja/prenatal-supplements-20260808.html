        <h1>専門家、妊娠期サプリの過剰な宣伝に警鐘</h1>
        <p>オーストラリアの妊娠ガイドラインでは、多くの妊婦に必要なのは葉酸、ヨウ素、鉄分が中心だとされています。ところが今は、SNSで追加のサプリが広まり、効かないか、避けられる害につながる可能性があると専門家が警告しています。重要なのは、妊娠中の情報が広告に引っ張られやすく、家族が根拠より販売文句にお金を使ってしまう点です。今後は、医療現場、規制当局、そしてプラットフォーム側の対応がどこまで進むかが焦点です。</p>
