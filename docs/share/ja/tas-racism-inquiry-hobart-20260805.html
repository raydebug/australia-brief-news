        <h1>タスマニアの人種差別調査で、1枚の写真がネット中傷を呼んだ経緯が語られた</h1>
        <p>先住民に対する人種差別、憎悪、暴力に関する連邦調査で、ホバートではソーシャルメディアの写真がすぐに人種差別的な中傷を招いたことが明かされた。証言では肌の色や先住民のアイデンティティをめぐるコメントが紹介され、公開投稿をきっかけにネット上の攻撃がいかに急速に膨らむかが示された。調査の記録は、人種差別がどう広がり、ソーシャルメディアの中傷がどれほどの害を与えるかを残す点で重要だ。次は、ホバートや他の都市でさらに証言が集まる。</p>
