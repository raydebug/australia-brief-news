        <h1>新しい前立腺がん指針で検査対象が広がる</h1>
        <p>新しい前立腺がん検診の指針は、45歳から検査を始める方向で、さらに一部の若年層や高齢層にも対象を広げる。前立腺がんはよくある病気で、早期発見が治療結果を変えうる一方、受診機会や費用、フォローアップの問題も浮かぶ。次の焦点は、医師がどれだけ早く新しい助言を取り入れるか、そして検査体制が増える需要に対応できるかだ。</p>
