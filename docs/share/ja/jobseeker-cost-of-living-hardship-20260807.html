        <h1>求職給付は今も多くの人に厳しい</h1>
        <p>所得支援に関する報道は、1日約68豪ドルの給付が、食事を削り、薬を減らし、家賃の支払いも苦しくさせる実態を示しています。記事で紹介された調査では、求職給付受給者は一般の人よりも1日1食以下でやりくりする割合が大幅に高いとされています。より大きな意味は、低い給付が食料支援、医療、住宅支援にまで負担を押し広げていることです。次の論点は、支援額をどこまで引き上げれば、この悪循環を止められるかです。</p>
