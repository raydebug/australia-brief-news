        <h1>ジェットスター、頭上収納の機内手荷物を有料化</h1>
        <p>ジェットスターは2027年2月から機内手荷物のルールを変え、無料で持ち込めるのは座席下に収まる小さなバッグだけにする。頭上収納に入れる大きめのバッグはPriority Carry-onの追加料金が必要になり、路線によっては25ドル前後から50ドル超になる。7キロの一律上限はなくなり、低運賃でも荷物の扱いが実質的に変わる。今後の焦点は、利用客がこの新しい料金体系を受け入れるか、他社に流れるかだ。</p>
