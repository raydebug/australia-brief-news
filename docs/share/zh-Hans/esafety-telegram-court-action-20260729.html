        <h1>澳洲eSafety监管机构起诉Telegram</h1>
        <p>澳洲eSafety监管机构已经启动诉讼，可能让Telegram面临最高5460万澳元罚款，理由是其被指未能及时清除支持恐怖主义的内容。监管方称，相关材料包括暴力宣传和极端主义内容，尽管用户已经举报，仍然可以访问。这个案件的重要性在于，它会检验澳洲在线安全法律如何适用于拥有大量本地用户的全球通讯平台。接下来由法院判断Telegram是否违反义务，以及后续会如何处理。</p>
