        <h1>澳洲的禽流感应对从圣诞岛扩展到野生动物风险警示</h1>
        <p>联邦政府将拨款超过 70 万澳元，为圣诞岛可能出现的 H5 禽流感疫情做准备；同时，新的风险评估显示，如果病毒扩散，数百种本地鸟类和哺乳动物都将面临高风险。这很重要，因为澳洲的应对正在从笼统警告转向对偏远岛屿设施和脆弱野生动物的具体准备。接下来要看的是，生物安全和栖息地保护能否在病毒扩散到更多地区之前迅速加强。</p>
