        <h1>澳洲南部禽流感扩散，野生动物防线再收紧</h1>
        <p>H5 禽流感正在澳大利亚南部继续扩散，野鸟、海狮和其他野生动物都出现更多病例和疑似病例。官方现在统计到 175 例确诊或推定阳性记录，像阿德莱德皇家秀这样的活动也已经取消了鸟类展项。这个局面重要，是因为疫情已经不再只是零星发现，而是在推动更严的生物安全、野生动物监测和活动调整。接下来要看当局能否在更多栖息地和沿海物种受影响前把病毒压下来。</p>
