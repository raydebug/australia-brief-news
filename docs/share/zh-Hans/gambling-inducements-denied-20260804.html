        <h1>博彩公司否认用毒品和陪侍诱导下注</h1>
        <p>参议院对博彩改革的审查听到指控称，一些博彩公司曾提供毒品、酒精和陪侍服务，以留住高价值客户继续下注。Sportsbet 和 Tabcorp 否认了这些说法，并表示如果有证据，应当交给执法部门。这个事件之所以重要，是因为它直接关系到政府正在推进的博彩广告改革，而议员们也在权衡现行法案是否足以遏制诱导奖励和面向儿童的广告。调查定于 8 月 17 日提交报告，接下来要看听证会是否会推动更严格的规则或正式调查。</p>
