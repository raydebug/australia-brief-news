        <h1>首置业担保计划被质疑被部分买家转作投资房</h1>
        <p>《卫报》的一篇分析显示，澳大利亚5%首置业担保计划里，近1500套房产后来被转成了投资房。报道说，在取消收入上限后，申请量明显上升，月度成交一度超过5600套。之所以重要，是因为这项计划原本是帮助自住买家入市，而不是给投资者留出另一条入口。接下来要看，联邦政府会不会收紧审核，还是维持现有规则。</p>
