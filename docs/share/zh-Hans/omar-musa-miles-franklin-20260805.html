        <h1>Omar Musa凭《Fierceland》赢得迈尔斯·富兰克林奖</h1>
        <p>Omar Musa凭小说《Fierceland》赢得2026年迈尔斯·富兰克林文学奖，获得六万澳元奖金。这部作品围绕家庭关系、继承与婆罗洲雨林遭受破坏展开，也让澳大利亚最重要的小说奖再次把东南亚澳大利亚叙事推到舞台中央。Omar Musa说，这本书来自多年积累，也与他对该地区的个人联系有关，评委则特别提到作品把节奏、政治和生态损失结合了起来。接下来要看这本书在获奖消息之外能触达多少读者。</p>
