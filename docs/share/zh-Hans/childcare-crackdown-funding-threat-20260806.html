        <h1>澳洲托儿所整治从提醒升级到资金威胁</h1>
        <p>教育监管部门正把对托儿机构的整治从提醒升级为资金威胁。最新一季度里，超过60家托儿中心收到整改通知，近600家服务机构因不达标被关闭。联邦政府表示，需要更强的执法来阻止反复违规，并更快地保护儿童安全，机构也会更快被追责。这之所以重要，是因为托儿安全已经变成监管、拨款和公众信任的现实考验。下一步要看是否会有更多机构被点名，以及是否有人被切断联邦资金。</p>
