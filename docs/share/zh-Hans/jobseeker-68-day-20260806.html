        <h1>靠 JobSeeker 生活仍是澳大利亚生活成本压力测试</h1>
        <p>澳大利亚领取 JobSeeker 的人仍然要靠每天约 68 澳元过活，而联邦预算里基本补助并没有上调。报道指出，房租、食物和交通是最主要的压力来源，倡议者认为这笔补助已经无法覆盖基本生活开支。这之所以重要，是因为讨论焦点已经从通胀扩展到贫困，以及仅靠指数化调整是否还能跟上现实。下一步要看政府是否重新审视补助水平，还是继续维持原状。</p>
