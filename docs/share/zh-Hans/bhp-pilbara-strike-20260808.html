        <h1>皮尔巴拉罢工威胁必和必拓铁矿石运输</h1>
        <p>必和必拓位于西澳黑德兰港的出口终端再次停工，工人就薪酬和工作条件展开为期两天的争议。约150名员工参与行动，涉及装船和相关岗位，而这里是澳大利亚最大的散装铁矿石港口之一。由于去年财年该矿区运出数亿吨铁矿石，即使短暂停摆也可能影响公司收入、州财政和海外客户。双方预计在8月18日恢复谈判，但围绕加薪幅度和时间表仍然没有接近共识。</p>
