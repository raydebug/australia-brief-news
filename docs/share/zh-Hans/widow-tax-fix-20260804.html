        <h1>工党着手填补“寡妇税”缺口，赶在下一轮税改前修补</h1>
        <p>工党正着手修补被批评者称作“寡妇税”的税务安排，把原本承诺的资本利得税和负扣税豁免更完整地适用于死亡和离婚情形。这个问题重要，因为共同持有的投资房产在关系结束或配偶去世时，可能会被这道缺口波及。财政部表示，草案咨询将持续到8月21日，所以真正的看点是补救措施能否在有脆弱持有人被旧规则影响之前到位。</p>
