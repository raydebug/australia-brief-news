        <h1>维州要求家禽留在棚内，以阻止禽流感扩散</h1>
        <p>维多利亚州已要求拥有 50 只以上家禽的饲主把鸟类留在室内，至少持续 14 天，以应对 H5 禽流感继续上升的检测结果。新规覆盖墨尔本都会区、沿海地区和部分周边地带，官方希望先把病毒挡在商业养殖场外。这样做关系到鸡蛋供应、散养标签和家禽企业，因为一旦病毒进入农场，影响会迅速扩大。接下来要看这项预防措施能否压住风险，还是还会有更严格的限制。</p>
