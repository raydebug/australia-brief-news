        <h1>澳统计局警告普查前警惕上门骗子</h1>
        <p>澳大利亚统计局提醒民众，在8月11日普查前要提防冒充普查人员上门的人。真正的工作人员不会索要银行资料、密码或其他敏感信息。这个提醒很重要，因为普查会影响学校、医疗和基础设施规划，骗局会在调查开始前就削弱信任。接下来要靠更多公开提醒和对可疑上门行为的及时举报。</p>
