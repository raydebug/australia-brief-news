        <h1>悉尼机场因塔台人手不足而大范围延误</h1>
        <p>由于空管人员不足，Airservices Australia 启动流量管制，悉尼机场随后出现大面积延误和取消。Qantas、Jetstar、Virgin 和 Rex 都受影响，有些旅客在停机坪上被耽搁了长达两小时。之所以重要，是因为这次混乱冲击了澳洲最关键的交通枢纽，也说明人员排班一旦吃紧，就会迅速波及全国航线网络。Airservices 说限制已经解除，但接下来的考验是他们能否在下一次高峰前把排班和人手补强。</p>
