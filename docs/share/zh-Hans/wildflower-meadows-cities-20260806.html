        <h1>澳大利亚城市里的本土野花种植正越来越多</h1>
        <p>澳大利亚各地的公园、路边绿带和其他市政空间，开始出现更多本土野花草甸。这个转变很重要，因为这类种植更能应对高温，维护成本也更低，而且比单纯草坪更有利于本地昆虫和鸟类。现在的问题是，会不会有更多地方政府跟进，把这种做法变成城市景观的标准配置。若真如此，这将不仅是外观上的变化，也是环境上的升级。</p>
