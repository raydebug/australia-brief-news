        <h1>布里斯班无家可归儿童人数升至1500人以上</h1>
        <p>Brisbane Zero 的最新统计显示，在上一财年，布里斯班共有 984 个家庭、1,539 名儿童被识别为无家可归者。大多数家庭由单亲母亲带领，这说明住房压力如何迅速演变成家庭流离失所。这个数字之所以重要，是因为它把城市住房危机变成了可衡量、可定位的现实，也显示临时住宿、学校和支援服务正在承压。接下来要看政府和社会服务机构是否能把这份统计转化为更稳定的住房路径。</p>
