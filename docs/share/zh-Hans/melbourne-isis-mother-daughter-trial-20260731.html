        <h1>墨尔本法院将涉ISIS母女送审</h1>
        <p>墨尔本法院已裁定，卡瓦萨尔·艾哈迈德和她的女儿泽伊纳布·艾哈迈德将就奴役指控接受审判。检方称，这个家庭与伊斯兰国有关，并控制过一名雅兹迪少女；案件接下来会进入维多利亚州最高法院，8月21日还有一次庭审安排。这个案件的重要性在于，它展示了澳洲法院如何处理在伊斯兰国崩解期间发生、但与澳洲有关联的严重罪行。下一步将进入庭前程序，证据和具体指控都会被检验。</p>
