        <h1>NAPLAN成绩下滑让纸笔考试再度成为焦点</h1>
        <p>教育部长们再次讨论让 NAPLAN 回到纸笔考试，因为最新结果显示，全国读写和算术成绩都很弱。大约三分之一学生没有达到基本标准，阅读成绩在各年级都比 2025 年更差，三年级数学仍然令人担忧。这个消息重要，因为它重新引发了对数字化测试、课堂支持和屏幕使用影响的讨论。下一步要看，各州部长是否会用这些结果来调整 NAPLAN 的做法。</p>
