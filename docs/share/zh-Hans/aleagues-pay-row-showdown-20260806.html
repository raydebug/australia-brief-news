        <p>A联赛与球员工会在新集体协议上仍然僵持不下，旧协议已在6月30日到期。最新方案包括提高女足薪资上限，并为更全面的职业化设定路线图，但球员方面认为，这一过程已经伤害了互信，而且联盟在公开沟通上太过仓促。这很重要，因为这场争议会影响工资、赛季稳定性，以及女足联赛未来的运作方式。下一步是球员仔细审议提案，并决定是否仍保留采取劳工行动的空间。</p>
