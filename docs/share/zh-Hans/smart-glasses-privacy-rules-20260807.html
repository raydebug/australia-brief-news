        <h1>澳大利亚开始收紧智能眼镜隐私监管</h1>
        <p>联邦总检察长已要求隐私专员审视智能眼镜带来的风险，因为这类设备可以在他人不易察觉时记录画面。监管机构担心，它们可能让女性、儿童和其他弱势群体更容易遭遇偷拍、骚扰和监视。眼下的关键，是现有隐私规则能否跟上可穿戴摄像和人脸分析工具的普及速度。接下来要看的是，法律是否需要更快调整，才能在这类设备更常见之前补上空缺。</p>
