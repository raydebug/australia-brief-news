        <h1>Kmart 的廉价摄像眼镜重新点燃隐私争议</h1>
        <p>Kmart 89 澳元的摄像眼镜很快卖光，也让低价可录制穿戴设备在澳大利亚再次成为隐私焦点。这些眼镜可以拍照和录视频，还能打电话并运行 AI 助手，因此隐私倡议者认为它们会让公共场所的同意问题变得更难处理。之所以重要，是因为这类产品价格足够低，扩散速度可能很快，而法律和场所规则还跟不上技术。接下来要看监管机构、零售商或公共场所会不会在这些设备变得普及前设下更清晰的限制。</p>
