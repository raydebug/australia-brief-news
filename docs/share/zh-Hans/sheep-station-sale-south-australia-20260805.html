        <h1>南澳大型绵羊站完成易手</h1>
        <p>澳大利亚一座最大的连续绵羊牧场完成出售，Jumbuck Pastoral 将 Commonwealth Hill 卖给了阿德莱德商人 Charlie Shahin。这个交易之所以重要，是因为它把南澳内陆一大片土地集中到私人手中，也说明大型牧业土地的价值依然很高。该牧场面积接近 130 万公顷，所在地区的规模、用水和物流条件都决定了它的商业价值。接下来要看，新东家会如何使用这片土地，以及交易是否会影响当地就业和生产。</p>
