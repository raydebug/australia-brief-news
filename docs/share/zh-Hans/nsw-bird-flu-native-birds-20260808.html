        <h1>新州确认本地野鸟出现首例禽流感</h1>
        <p>新南威尔士州已经确认，本地野鸟中出现了 H5 禽流感，说明病毒已经进入州内野生动物群体。眼下最需要关注的是，它会不会沿着湿地、海岸和内陆水系继续扩散。这个消息重要，是因为澳大利亚仍在努力控制一场可能在当地物种中迅速放大的疫情。下一步是加强监测和生物安全检查，判断这只是孤立发现，还是更广泛传播的开端。</p>
