        <h1>澳大利亚在低价摄像眼镜普及之际重新考虑隐私规则</h1>
        <p>带摄像头的低价智能眼镜正在把澳大利亚的隐私规则重新推到前台。总检察长已要求隐私专员审视这一问题，原因是 Kmart 89 澳元的产品售罄，批评者担心会出现偷偷录影。这个话题重要，是因为这类设备在法律还没有明确防线前就变得更便宜、更普遍。接下来要看堪培拉是把它当作一次隐私修补，还是主要继续交给各州和领地现有法律处理。</p>
