        <h1>低价智能眼镜引发澳大利亚新的隐私审查</h1>
        <p>澳大利亚隐私监管机构正被要求审视带内置摄像头的低价智能眼镜扩散带来的风险。官员承认这类设备有用途，但也会让暗中拍摄和骚扰更容易，尤其是在公共场所。之所以重要，是因为这类产品越来越便宜，而隐私规则还没完全跟上。监管层现在必须判断现有法律是否足够，还是需要新的限制。</p>
