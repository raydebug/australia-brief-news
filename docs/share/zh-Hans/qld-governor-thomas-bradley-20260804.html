        <h1>昆士兰任命 Thomas Bradley 出任总督</h1>
        <p>昆士兰州已经宣布高等法院法官 Thomas Bradley 将出任下一任州总督，宣誓就职时间定在11月。Bradley 将接替 Jeannette Young，并把长期的司法背景带进这个职位。之所以重要，是因为总督既有宪制角色，也有象征意义，这次任命也说明政府想让什么样的公众人物代表这个州。接下来要看 Bradley 在政治繁忙的任期里会如何运用这个职位。</p>
