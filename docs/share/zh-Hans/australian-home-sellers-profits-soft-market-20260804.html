        <h1>澳洲卖家大多仍在赚钱，但楼市明显降温</h1>
        <p>AAP 的最新数据说明，尽管房价降温，绝大多数卖家在出售房屋时仍能获利。2026 年上半年卖出的房子里，亏损成交的比例不到 3%，但负资产担忧已经开始出现。这个变化重要，因为它说明住房市场不再像前几年那样一边倒地偏向卖家。接下来要看的是，如果价格继续回落，卖家利润还能维持多久。</p>
