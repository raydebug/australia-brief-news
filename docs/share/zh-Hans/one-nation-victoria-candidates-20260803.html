        <p>One Nation公布了首批维州州选候选人，同时Pauline Hanson将ABC、《卫报》和《时代报》排除在发布会之外的做法继续引发争议。Warren Pickering领衔维州战线，名单里既有前自由党人士，也有地方候选人，显示该党正试图在州选前站稳脚跟。这个事件之所以重要，是因为它同时暴露出一国党的选举野心和对舆论曝光的控制欲。接下来要看他们能否在选战真正展开前拿出更清晰的政策说明。</p>
