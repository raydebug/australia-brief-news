        <h1>新州拒绝扩大仇恨言论保护范围</h1>
        <p>新南威尔士州政府在一份由州政府委托的审查报告后，决定不把仇恨言论法扩大到更多群体。报告原本建议把保护范围进一步放宽，但部长们表示，在修改法律前，还需要把法律和执行层面的疑问继续理清。这个问题重要，因为它正好碰到言论自由、反歧视法和社区安全的交界。下一步要看政府是否会重新考虑这项建议，还是维持现有法律不变。</p>
