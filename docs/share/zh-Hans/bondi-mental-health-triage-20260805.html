        <h1>新州在 Bondi 之后让更多危机来电先由临床人员接手</h1>
        <p>新南威尔士州正在把更多心理危机来电交给临床人员先行分流，health-led response 的角色会更大。这个变化来自 Bondi Junction 事件的调查，也与 NSW Ambulance 内部的虚拟转介中心计划相连；如果存在安全风险，警方仍会介入。这个做法的重要性在于，它试图在第一接触点减少升级，并让情绪危机中的人更快得到医疗回应。真正的考验是项目能否迅速落地、运行顺畅，并拥有足够人手。</p>
