        <h1>新州北部救援直升机合同再受审视</h1>
        <p>一次议会调查让新州北部的救援直升机服务再次承压，报告提到霸凌、虐待和运营管理等严重问题。委员会认为，除非安全隐患得到解决，NSW Ambulance 不应延长这份合同。这个决定很重要，因为该服务是大片偏远地区急救网络的一部分，一旦受影响，转运和救援时间都可能变长。新州政府现在有三个月回应调查建议。</p>
