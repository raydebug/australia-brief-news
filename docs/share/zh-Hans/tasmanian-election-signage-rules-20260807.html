        <h1>塔斯马尼亚候选人称选举告示地址规定让家人暴露在风险中</h1>
        <p>塔斯马尼亚的选举规则要求竞选海报、广告和传单写明制作人的真实姓名和地址。部分候选人说，这种公开方式在火药味很重的竞选中可能让家人和工作人员暴露在风险里。这个问题的关键在于，选举透明度应当说明是谁在投放政治宣传，而不是把住址变成安全隐患。接下来要看选举管理方或立法者是否会在投票升温前放宽这项规定。</p>
