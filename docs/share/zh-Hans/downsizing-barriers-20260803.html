        <h1>年长的澳大利亚人仍然面临缩小住房的障碍</h1>
        <p>许多55岁以上的澳大利亚人表示，他们愿意搬进较小的房屋，但实际的障碍不断减缓这种转变。最大的障碍是情感依恋、稀缺的合适库存以及搬家的成本和文书工作。这很重要，因为推出更多适合缩小规模的住房可以缓解紧张的房地产市场的压力。下一步是规划和税收设置是否使较小的房屋更容易找到和搬进。</p>
