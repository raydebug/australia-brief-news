        <h1>悉尼机场延误冲击数千名旅客</h1>
        <p>悉尼机场当天有数十个航班延误，Airservices Australia 表示，排班问题影响了空中交通管理，波及超过 150 个航班。这个消息重要，是因为一次人手或排班故障就可能连锁影响值机、转机和取消，牵动数千名旅客。现在最关键的是运营能否尽快恢复正常，以及这是否反映更广泛的 staffing 问题。乘客仍需要在出发前向航空公司确认航班。</p>
