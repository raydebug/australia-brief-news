        <h1>布里斯班维多利亚公园奥运方案面临资金和设计审视</h1>
        <p>昆士兰公布了 2032 年奥运和残奥会的维多利亚公园总体方案，包括一座可容纳 6.3 万人的体育场、通往市中心的新连接，以及更多公共空间。这个方案之所以重要，是因为它把数十亿资金投向布里斯班最大的内城项目之一，并将长期影响交通和公园用地。现在仍未解决的问题包括整个区域的最终成本、资金如何分摊，以及如何处理历史和文化方面的反对意见。随着方案从概念走向落实，争论预计还会继续。</p>
