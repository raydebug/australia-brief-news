        <h1>维州教师因薪酬谈判停滞准备再度罢工</h1>
        <p>维多利亚州公立学校教师将在州工会表示最新薪酬方案仍然不够后，再次举行 24 小时罢工。这很重要，因为反复停工会扰乱家庭安排，也说明在数月谈判后，争议依然没有解决。如果双方都不让步，8 月 19 日的罢工就可能照常发生，并继续向政府施压，要求提高报价。</p>
