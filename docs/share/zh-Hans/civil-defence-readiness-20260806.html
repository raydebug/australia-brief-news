        <h1>澳洲启动战时民防准备审查，回应长期空白</h1>
        <p>一项新的联邦调查将检查，如果冲突扰乱全国，澳洲如何让燃料、物资、政府服务和商业运作继续维持。调查要求委员会不只看军队本身，也要看民用机构和私营部门在危机中的协作方式。之所以重要，是因为澳洲自第二次世界大战以来，几乎没有做过这种规模的全国准备审查。接下来要看各方提交的证据，能否指出供应链和协调机制里最脆弱的环节。</p>
