        <h1>韩森禁止多家媒体进入记者会引发新闻自由争议</h1>
        <p>汉森把澳大利亚广播公司、《卫报》和《时代报》挡在维州一场记者会外面，随后又把这次做法说成是对记者的一次临时提醒。争议发生时，一国党正在推出候选人并试图在州内扩张影响力。它的重要性在于，这触及政治人物是否可以选择性开放采访，以及媒体监督能否保持同等通道。汉森后来表示禁令不会一直持续，但她并没有收回这场批评。</p>
