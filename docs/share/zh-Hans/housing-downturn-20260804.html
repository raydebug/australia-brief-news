        <h1>澳大利亚房价下行加深，跌势扩散到更多城市</h1>
        <p>澳大利亚房价在7月再次回落，而且跌势已经不再只局限于悉尼和墨尔本。Cotality的数据显示，全国房价下跌0.7%，布里斯班和阿德莱德也继续走弱，而各家银行正在重新调整全年预测。这个变化会影响借贷能力、投资者情绪，以及等待更低门槛入市的首置买家。接下来要看降息预期或信贷环境是否能减缓这轮下滑。</p>
