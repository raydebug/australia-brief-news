        <h1>澳大利亚房市下行扩大，近期买家承压更明显</h1>
        <p>7月房价再次下跌，而且跌势已经不再只局限于悉尼和墨尔本。AAP称，大约34,000名使用5%首置房押金计划的买家，在市场继续走弱时可能面临负资产；Cotality的数据则显示，全国房价当月仍下跌0.7%。这意味着房价走软一方面有利于新买家，另一方面也会加重近期买房者的压力，并可能影响放贷信心。接下来要看降息、挂牌量增加或政策变化，能否让市场稳定下来。</p>
