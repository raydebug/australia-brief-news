        <h1>维州重组内阁，新增 AI 部长并缩减基础设施组合</h1>
        <p>维多利亚州的新内阁把交通基础设施和郊区铁路环线等职责重新拆分，同时也新设了 AI 部长职位。这次调整发生在上周领导层更替和多名内阁成员辞职之后，因此多个组合被一起重排。它之所以重要，是因为这会改变大型项目由谁主导，也说明政府下一步想把政策重点放在哪里。接下来要看的是，新班子能否尽快稳定下来，把议程继续往前推。</p>
